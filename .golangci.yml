version: "2"

# golangci-lint configuration

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ginsys/shelly-manager

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  disable:
    - depguard
    - funlen
    - gochecknoglobals
    - godot
    - godox
    - err113
    - mnd
    - nestif
    - testpackage
    - wsl

  settings:
    govet:
      enable:
        - shadow
    # QF1012 wants fmt.Fprintf instead of
    # strings.Builder.WriteString(fmt.Sprintf).
    # Builder.WriteString always returns a nil error.
    # Fprintf's error is checked by errcheck, so the rewrite
    # does not compile cleanly.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1012

    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
