name: Release dry run

# Proves the release workflow before a change to it merges: a dry run of the shared release workflow on
# the pull request, with no secret. The dry run is literal (`dry_run: true`) and this file has no
# dispatch, so it can never make a release. It is not a required check: a pull request from a fork has a
# read-only token, so the called workflow, which asks for `contents: write`, does not start there.
# The real release is release.yml.

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - '.goreleaser.yaml'
      - 'VERSION'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  release:
    # The release pull request changes VERSION and CHANGELOG.md, and its new section has no tag until
    # the merge, so the dry run would fail there for a reason that is not a fault.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    permissions:
      contents: write
      pull-requests: read
    uses: ginsys/.github/.github/workflows/release.yml@31fe25d73f696b3b13d7a728f4d5dd4518d58a86 # 2026-11-23
    with:
      action: release
      dry_run: true
