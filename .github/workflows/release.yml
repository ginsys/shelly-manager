name: Release

# The release runs in the shared workflow of ginsys/.github (docs/release.md there): pick an action and
# whether it is a dry run (the default). A real run cuts a release pull request, waits for its merge and
# makes the tag. How to run it: docs/development/RELEASING.md.
#
# This file has one trigger, a dispatch, because it can make a real release. The dry run that proves a
# change to the release before it merges is release-dry-run.yml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        default: release
        options:
          - release
          - release-as-beta
          - release-as-rc
          - release-as-stable
          - start-next-minor
          - start-next-major
          - skip-prerelease-number
      dry_run:
        description: 'Dry run: preview only, change nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
    uses: ginsys/.github/.github/workflows/release.yml@31fe25d73f696b3b13d7a728f4d5dd4518d58a86 # 2026-11-23
    with:
      action: ${{ inputs.action }}
      dry_run: ${{ inputs.dry_run }}
