name: Build and Push Docker Images

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # Allow manual triggering
  # The release workflow calls this build from a tag. A non-empty `version` (vX.Y.Z or
  # vX.Y.Z-alpha|beta|rc.N) builds even when no Docker file changed, adds it as an image
  # tag beside the date-sha tag, and stamps it into both binaries. A release never moves
  # latest: that tag stays the newest main image. With no version the build is exactly the one
  # the two triggers above make. The caller must grant contents: read and packages: write.
  workflow_call:
    inputs:
      version:
        description: 'Release version to tag and stamp; empty for an ordinary build'
        required: false
        type: string
        default: ''

# Security: Explicitly declare minimum required permissions
# CodeQL: actions/missing-workflow-permissions - fixed
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ginsys

jobs:
  filter-changes:
    name: Check relevant file changes
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.last_build.outputs.sha == '' && 'true' || steps.filter.outputs.docker_relevant }}
    steps:
      - name: Checkout repository at triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use the commit that triggered the Test workflow when workflow_run
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Find the commit of the last image build
        id: last_build
        # The change set is everything since the images were last built, not the last commit: a push of
        # several commits is one Test run on its tip, and a docs tip hides an earlier code commit. No
        # answer is no base, and then the run builds. A release version skips this and always builds:
        # a tag has no change set to compare.
        if: ${{ inputs.version == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "sha=$(bash scripts/ci/last-built-commit.sh shelly-provisioner)" >> "$GITHUB_OUTPUT"

      - name: Detect changes relevant to Docker images
        id: filter
        if: ${{ inputs.version == '' && steps.last_build.outputs.sha != '' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ steps.last_build.outputs.sha }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # What an image is built from, then one exclusion; any other path never matches. The filter is
          # one flat list: a nested `paths:` / `paths-ignore:` mapping is read by the action as change types
          # and matches no file, which kept every build job skipped.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docker_relevant:
              - 'deploy/docker/**'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'configs/**'
              - 'ui/**'
              - '!**/*_test.go'

      - name: Summarize change detection
        if: ${{ inputs.version == '' }}
        env:
          BASE: ${{ steps.last_build.outputs.sha }}
          RELEVANT: ${{ steps.last_build.outputs.sha == '' && 'true' || steps.filter.outputs.docker_relevant }}
        run: |
          if [ "$RELEVANT" = "true" ]; then
            echo "## Docker build eligibility ✅" >> $GITHUB_STEP_SUMMARY
            echo "Relevant changes since ${BASE:-no earlier image build (building)}. Proceeding to build when tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Docker build skipped ⛔" >> $GITHUB_STEP_SUMMARY
            echo "No relevant changes (or only tests/docs)." >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: [filter-changes]
    # Run only if tests passed (workflow_run) and relevant changes detected; allow manual trigger + relevant changes;
    # a call with a release version (event name of the caller, so not tested here) always builds
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || inputs.version != '') && needs.filter-changes.outputs.build_needed == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check the release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # The value becomes an image tag and a -ldflags string: vX.Y.Z or vX.Y.Z-alpha|beta|rc.N, nothing else.
          # bash matches the whole value, so a second line cannot ride behind a valid first one (grep tests per line).
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! $RELEASE_VERSION =~ $re ]]; then
            echo "::error::version must be vX.Y.Z or vX.Y.Z-alpha|beta|rc.N, got '$RELEASE_VERSION'"
            exit 1
          fi

      - name: Display workflow trigger info
        run: |
          echo "## Docker Build Triggered 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "- **Trigger**: Test workflow completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Workflow**: ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Conclusion**: ${{ github.event.workflow_run.conclusion }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Run URL**: ${{ github.event.workflow_run.html_url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Trigger**: Manual workflow dispatch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build images from the same commit that passed tests
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Fetch full history for accurate timestamps
          fetch-depth: 0
          
      - name: Generate version tag
        id: version
        run: |
          # Generate timestamp-based version tag
          DATE=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated version tag: ${VERSION}"
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
          config-inline: |
            [worker.oci]
              max-parallelism = 1
            
      - name: Clear Docker build cache
        run: |
          docker builder prune -a -f
          docker system prune -f
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Manager
        id: meta-manager
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-manager
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.version == '' }}
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}
          labels: |
            org.opencontainers.image.title=Shelly Manager
            org.opencontainers.image.description=Smart home device manager for Shelly devices
            org.opencontainers.image.version=${{ inputs.version || steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.date }}
            
      - name: Extract metadata for Provisioner
        id: meta-provisioner
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-provisioner
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.version == '' }}
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}
          labels: |
            org.opencontainers.image.title=Shelly Provisioner
            org.opencontainers.image.description=WiFi provisioning agent for Shelly smart home devices
            org.opencontainers.image.version=${{ inputs.version || steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.date }}
            
      - name: Build and push Manager image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}
          no-cache: true
          build-args: |
            BUILDTIME=${{ steps.version.outputs.date }}
            ${{ inputs.version != '' && format('VERSION={0}', inputs.version) || '' }}
            REVISION=${{ github.sha }}
            CGO_ENABLED=0
            GOOS=linux
            
      - name: Build and push Provisioner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-provisioner.outputs.tags }}
          labels: ${{ steps.meta-provisioner.outputs.labels }}
          no-cache: true
          build-args: |
            BUILDTIME=${{ steps.version.outputs.date }}
            ${{ inputs.version != '' && format('VERSION={0}', inputs.version) || '' }}
            REVISION=${{ github.sha }}
            CGO_ENABLED=0
            GOOS=linux
            
      - name: Output image information
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "## Container Images Built and Pushed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RELEASE_VERSION" ]; then
            echo "- **Release Version**: \`${RELEASE_VERSION}\` (tagged on both images, stamped in both binaries)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: \`${{ steps.version.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA**: \`${{ steps.version.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Published" >> $GITHUB_STEP_SUMMARY
          echo "#### Shelly Manager" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-manager:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-manager:${RELEASE_VERSION:-latest}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Shelly Provisioner" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-provisioner:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/shelly-provisioner:${RELEASE_VERSION:-latest}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Update docker-compose to use new version" >> $GITHUB_STEP_SUMMARY
          echo "export TAG=${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "cd deploy/docker-compose" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose pull" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
      - name: Clean up
        if: always()
        run: |
          # Clean up any build cache or temporary files
          docker buildx prune -f --filter until=24h || true
