name: Changelog fragment

# A PR records its release note as a file in changelog.d/ (see changelog.d/README.md), so two PRs never
# edit the same CHANGELOG.md lines. The check is the shared workflow of ginsys/.github. This file is its
# own small workflow so that toggling the no-changelog label re-runs it alone, and not the Go and UI
# jobs of the Test workflow.

permissions:
  contents: read

# The caller owns the group: a reusable workflow that built it from github.workflow would equal this
# one and be cancelled as a deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  changelog-fragment:
    permissions:
      contents: read
    uses: ginsys/.github/.github/workflows/changelog-fragment.yml@31fe25d73f696b3b13d7a728f4d5dd4518d58a86 # 2026-11-23
