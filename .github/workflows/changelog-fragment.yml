name: Changelog fragment

# A PR records its release note as a file in changelog.d/ (see changelog.d/README.md),
# so two PRs never edit the same CHANGELOG.md lines. This job is its own small
# workflow so that toggling the no-changelog label re-runs it alone, and not the
# Go and UI jobs of the Test workflow.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  changelog-fragment:
    name: changelog-fragment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # The check diffs against the merge base, which a depth-1 checkout lacks.
        fetch-depth: 0
    - name: Test the changelog scripts
      run: bash scripts/test-changelog-fragments.sh
    - name: Check the PR adds a fragment
      env:
        BASE_REF: ${{ github.base_ref }}
        HEAD_REF_NAME: ${{ github.head_ref }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      run: bash scripts/check-changelog-fragment.sh
