apiVersion: v1
kind: ConfigMap
metadata:
  name: shelly-manager-config
  labels:
    app: shelly-manager
    component: configuration
data:
  # Every name is SHELLY_ + the config key with "." as "_": the app reads no
  # other environment name. internal/config/deploy_env_names_test.go checks it.
  # SHELLY_DATABASE_USERNAME and SHELLY_DATABASE_PASSWORD come from the Secret
  # (deployment.yaml) and never belong in a ConfigMap.

  # Server Configuration
  SHELLY_SERVER_PORT: "8080"
  SHELLY_SERVER_HOST: "0.0.0.0"

  # Database Configuration
  SHELLY_DATABASE_PROVIDER: "sqlite"
  SHELLY_DATABASE_PATH: "/data/shelly.db"

  # Logging Configuration
  SHELLY_LOGGING_LEVEL: "info"
  SHELLY_LOGGING_FORMAT: "json"
  SHELLY_LOGGING_OUTPUT: "stdout"

  # Discovery Configuration
  SHELLY_DISCOVERY_ENABLED: "true"
  SHELLY_DISCOVERY_NETWORKS: "192.168.1.0/24"
  SHELLY_DISCOVERY_INTERVAL: "300"
  SHELLY_DISCOVERY_TIMEOUT: "5"
  SHELLY_DISCOVERY_ENABLE_MDNS: "true"
  SHELLY_DISCOVERY_ENABLE_SSDP: "true"
  SHELLY_DISCOVERY_CONCURRENT_SCANS: "20"

  # Provisioning Configuration
  SHELLY_PROVISIONING_AUTO_PROVISION: "false"
  SHELLY_PROVISIONING_PROVISION_INTERVAL: "600"
  SHELLY_PROVISIONING_AUTH_ENABLED: "false"
  SHELLY_PROVISIONING_AUTH_USER: "admin"
  SHELLY_PROVISIONING_CLOUD_ENABLED: "false"
  SHELLY_PROVISIONING_MQTT_ENABLED: "false"
  SHELLY_PROVISIONING_DEVICE_NAME_PATTERN: "shelly_{type}_{mac}"

  # Metrics Configuration
  SHELLY_METRICS_ENABLED: "true"
  SHELLY_METRICS_PROMETHEUS_ENABLED: "true"
  SHELLY_METRICS_PROMETHEUS_PORT: "9090"
  SHELLY_METRICS_COLLECTION_INTERVAL: "300"
  SHELLY_METRICS_RETENTION_DAYS: "30"
  SHELLY_METRICS_ENABLE_HTTP_METRICS: "true"
  SHELLY_METRICS_ENABLE_DETAILED_TIMING: "false"
