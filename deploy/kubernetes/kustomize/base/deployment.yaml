apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-manager
  labels:
    app: shelly-manager
    component: api-server
spec:
  replicas: 1
  # One replica on a SQLite file: the old pod must be gone before the new one opens the file, so a
  # restart never overlaps two servers (a staged restore is applied by the start).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelly-manager
      component: api-server
  template:
    metadata:
      labels:
        app: shelly-manager
        component: api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: manager
        image: ghcr.io/ginsys/shelly-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: shelly-manager-config
        env:
        - name: SHELLY_NOTIFICATIONS_EMAIL_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: smtp-password
        - name: SHELLY_OPNSENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: opnsense-api-key
        - name: SHELLY_OPNSENSE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: opnsense-api-secret
        - name: SHELLY_SECURITY_ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: admin-api-key
        - name: SHELLY_SECURITY_AGENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: agent-api-key
        - name: SHELLY_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: database-password
        - name: SHELLY_DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: database-username
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /.cache
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: shelly-manager-data
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: shelly-provisioner
  labels:
    app: shelly-manager
    component: provisioner
spec:
  selector:
    matchLabels:
      app: shelly-manager
      component: provisioner
  template:
    metadata:
      labels:
        app: shelly-manager
        component: provisioner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true  # Required for WiFi interface access
      # Without this a host-network pod uses the node's resolver and cannot resolve the
      # manager Service name.
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: provisioner
        image: ghcr.io/ginsys/shelly-provisioner:latest
        imagePullPolicy: IfNotPresent
        env:
        # The manager Service is named with the overlay's prefix and listens on port 80, so
        # each overlay sets SHELLY_API_URL in its configMapGenerator and no value fits here.
        # An overlay that sets none leaves the pod unable to start, not dialling a default.
        - name: SHELLY_API_URL
          valueFrom:
            configMapKeyRef:
              name: shelly-manager-config
              key: SHELLY_API_URL
        # The manager refuses the agent routes without a key when it has an admin key. The agent sends
        # its own key, which opens those routes only. It comes from the Secret, never from a literal here.
        - name: SHELLY_API_KEY
          valueFrom:
            secretKeyRef:
              name: shelly-manager-secrets
              key: agent-api-key
        - name: SHELLY_LOGGING_LEVEL
          value: "info"
        - name: SHELLY_LOGGING_FORMAT
          value: "json"
        - name: SHELLY_LOGGING_OUTPUT
          value: "stdout"
        - name: SHELLY_PROVISIONING_PROVISION_INTERVAL
          value: "600"
        - name: SHELLY_PROVISIONING_AUTO_PROVISION
          value: "false"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
            - /app/shelly-provisioner
            - status
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /app/shelly-provisioner
            - status
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: true  # Required for network operations
          privileged: true                # Required for WiFi interface access
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        volumeMounts:
        - name: wpa-supplicant
          mountPath: /var/run/wpa_supplicant
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: wpa-supplicant
        hostPath:
          path: /var/run/wpa_supplicant
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
