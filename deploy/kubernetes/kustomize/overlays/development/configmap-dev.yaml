apiVersion: v1
kind: ConfigMap
metadata:
  name: shelly-manager-config
data:
  # Development-specific overrides
  SHELLY_LOGGING_LEVEL: "debug"
  SHELLY_LOGGING_FORMAT: "text"

  # Use ephemeral storage for development
  SHELLY_DATABASE_PATH: "/tmp/shelly.db"

  # Enable detailed metrics for debugging
  SHELLY_METRICS_ENABLE_DETAILED_TIMING: "true"

  # Faster intervals for development
  SHELLY_DISCOVERY_INTERVAL: "60"
  SHELLY_PROVISIONING_PROVISION_INTERVAL: "300"
