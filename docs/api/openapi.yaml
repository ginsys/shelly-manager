  # Bulk Operations
  /api/v1/config/bulk-import:
    post:
      tags: [Configuration]
      summary: Bulk import configurations
      description: >-
        Reads the live configuration of each named device into the manager, as
        POST /api/v1/devices/{id}/config/import does for one device. It never writes to a device.
        An id that names no device is that device's `failed` entry and the others still run.
      operationId: bulkImportConfigs
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Bulk import result; `data` is a BulkConfigResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-drift-detect:
    post:
      tags: [Drift]
      summary: Bulk drift detection
      description: Compares the stored and the live configuration of each named device. It never writes to a device.
      operationId: bulkDetectDrift
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Bulk drift detection result; `data` is a BulkDriftResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-drift-detect-enhanced:
    post:
      tags: [Drift]
      summary: Bulk drift detection with comprehensive reporting
      description: >-
        The same selection and `stop_on_error` as bulk-drift-detect; the answer is the
        comprehensive drift report, which covers the devices that ran. With `stop_on_error` the
        devices after the first error are not contacted and are not in the report, so its totals
        add up. If the report cannot be generated or stored, the call still answers 200 with the
        BulkDriftResult of bulk-drift-detect (`data.total`, `data.results`) in its place.
      operationId: bulkDetectDriftEnhanced
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Enhanced bulk drift detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

