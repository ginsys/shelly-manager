  # Drift Detection Endpoints
  /api/v1/config/drift-schedules:
    get:
      tags: [Drift]
      summary: List drift detection schedules
      operationId: listDriftSchedules
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriftSchedule'

    post:
      tags: [Drift]
      summary: Create drift detection schedule
      description: >-
        Stores a schedule and its device list. An enabled schedule is armed at the
        next instant of its spec. A stored schedule runs only when the scheduler is
        on (drift.scheduler_enabled, off by default), so with it off a created
        schedule never runs. An invalid body writes nothing.
      operationId: createDriftSchedule
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftScheduleInput'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftScheduleResponse'
        '400':
          description: Invalid body, cron spec, device selection or unknown device id

  /api/v1/config/drift-schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Drift]
      summary: Get drift schedule
      operationId: getDriftSchedule
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Schedule details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DriftSchedule'

    put:
      tags: [Drift]
      summary: Update drift schedule
      description: >-
        Replaces the editable fields and the device list or filter. The next run is
        recomputed when the spec changes or the schedule becomes enabled, and stays
        as it is otherwise. An invalid body changes nothing. The body carries the `revision` the
        caller read, and the update is made only if that is still the stored revision.
      operationId: updateDriftSchedule
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftScheduleUpdate'
      responses:
        '200':
          description: Schedule updated; its `revision` is one higher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftScheduleResponse'
        '400':
          description: Invalid id, body, cron spec, device selection or unknown device id, or no `revision` in the body
        '404':
          description: No such schedule
        '409':
          description: >-
            The schedule changed since the caller read it (its stored `revision` is not the one sent).
            Nothing is written. `error.details` holds the current schedule.

    delete:
      tags: [Drift]
      summary: Delete drift schedule
      operationId: deleteDriftSchedule
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Schedule deleted, with its device list and its runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: deleted
        '404':
          description: No such schedule

  /api/v1/config/drift-schedules/{id}/toggle:
    post:
      tags: [Drift]
      summary: Toggle drift schedule enabled state
      description: >-
        Turning a schedule on arms it from now, so a long pause causes no catch-up
        run. Turning it off clears its next run. A stored spec that no longer
        parses (a six-field spec saved by an older release) cannot be enabled until
        it is updated.
      operationId: toggleDriftSchedule
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The schedule with its new state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftScheduleResponse'
        '400':
          description: Invalid id, or the stored spec does not parse
        '404':
          description: No such schedule

  /api/v1/config/drift-schedules/{id}/runs:
    get:
      tags: [Drift]
      summary: List the runs of a drift schedule
      description: >-
        The runs the scheduler recorded, newest first, without their results. A
        schedule that has not run yet gives an empty array. The scheduler keeps the
        newest 100 runs per schedule.
      operationId: getDriftScheduleRuns
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The runs, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriftRun'
        '400':
          description: Invalid id, or a limit that is not a whole number from 1 to 100
        '404':
          description: No such schedule

  /api/v1/config/drift-scheduler:
    get:
      tags: [Drift]
      summary: Say whether this server runs the drift scheduler
      description: >-
        Reports drift.scheduler_enabled of the server that answers. With it off,
        schedules are stored and shown and none runs. It reads the configuration of
        one process, so replicas configured differently answer differently.
      operationId: getDriftSchedulerStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: The scheduler state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [enabled]
                        properties:
                          enabled:
                            type: boolean

  /api/v1/config/drift-reports:
    get:
      tags: [Drift]
