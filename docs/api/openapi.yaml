          description: The task is not assigned to the token's agent (an unassigned or unknown task is nobody's)
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/provisioner/discovered-devices:
    get:
      tags: [Provisioning]
      summary: Get discovered devices
      operationId: getDiscoveredDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Discovered devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

    post:
      tags: [Provisioning]
      summary: Report discovered devices
      operationId: reportDiscoveredDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  description: Must be the token's agent. A named `task_id` is completed only if assigned to it.
                devices:
                  type: array
                  items:
                    $ref: '#/components/schemas/Device'
      responses:
        '401':
          description: No known agent token, so the agent registers again
        '403':
          description: The body `agent_id` is not the token's agent
        '200':
          description: Devices reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/provisioner/health:
    get:
      tags: [Provisioning]
      summary: Provisioner health check
      operationId: getProvisionerHealth
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # DHCP Endpoint
  /api/v1/dhcp/reservations:
    get:
      tags: [Admin]
      summary: Get DHCP reservations
      operationId: getDhcpReservations
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: >-
            DHCP reservations, a JSON array under `data`. It is always empty
            today.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  # Admin Endpoints
  /api/v1/admin/rotate-admin-key:
    post:
      tags: [Admin]
      summary: Rotate admin API key
      operationId: rotateAdminKey
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_key:
                  type: string
                  description: The new admin key. It must not be blank and must not start or end with whitespace, because header handling drops it (always at the end, and at the start in `X-API-Key`), so the key could not be presented reliably.
              required:
                - new_key
      responses:
        '200':
          description: Key rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid JSON, a blank key, or a key that starts or ends with whitespace (VALIDATION_FAILED); the stored key does not change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
