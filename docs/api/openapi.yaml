openapi: 3.1.0
info:
  title: Shelly Manager API
  description: |
    Comprehensive API for managing Shelly smart home devices.

    Features include:
    - Device discovery and management
    - Configuration templates and drift detection
    - Export/Import in multiple formats (JSON, YAML, SMA, GitOps)
    - Real-time metrics via WebSocket
    - Multi-channel notifications
    - Provisioner agent management
  version: 1.0.0
  contact:
    name: Shelly Manager
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://shelly.example.com
    description: Production server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Devices
    description: Device management operations
  - name: Configuration
    description: Device configuration management
  - name: Templates
    description: Configuration templates
  - name: Drift
    description: Configuration drift detection
  - name: Export
    description: Export and backup operations
  - name: Import
    description: Import and restore operations
  - name: Notifications
    description: Notification channels and rules
  - name: Metrics
    description: Metrics and monitoring
  - name: Provisioning
    description: Device discovery and provisioning
  - name: Admin
    description: Administrative operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    AgentToken:
      name: X-Agent-Token
      in: header
      required: false
      description: >-
        The agent's own token, returned as `agent_token` when it registered. Needed with the agent key on the
        routes that act for one agent; the admin key needs none. Not checked when the manager has no admin key.
      schema:
        type: string

  schemas:
    # Common Response Wrapper
    APIResponse:
      type: object
      description: >-
        The envelope of a response. `success` and `timestamp` are always sent.
        `data` is left out when a route has nothing to return, `error` is sent
        on a failure only, and `meta` and `request_id` are optional.
      required: [success, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          $ref: '#/components/schemas/APIError'
        meta:
          $ref: '#/components/schemas/Metadata'
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    # Bulk configuration routes (bulk-import, bulk-drift-detect,
    # bulk-drift-detect-enhanced) act on the named devices only.
    BulkDeviceRequest:
      type: object
      additionalProperties: false
      required: [device_ids]
      properties:
        device_ids:
          type: array
          minItems: 1
          description: >-
            The devices to act on. Each id is a positive integer; a repeated id runs once, in
            first-seen order. A missing or empty list is refused, and no device is contacted.
          items:
            type: integer
            minimum: 1
        options:
          type: object
          additionalProperties: false
          properties:
            stop_on_error:
              type: boolean
              default: false
              description: >-
                After the first failed device the remaining devices are reported `skipped` and are
                not contacted.

    BulkConfigResult:
      type: object
      description: Answer of bulk-import, in the `data` member.
      properties:
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              device_ip:
                type: string
              config_id:
                type: integer
                description: The stored configuration the import wrote.
              status:
                type: string
                enum: [success, failed, skipped]
              error:
                type: string

    BulkDriftResult:
      type: object
      description: Answer of bulk-drift-detect, in the `data` member.
      properties:
        total:
          type: integer
        in_sync:
          type: integer
        drifted:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              device_ip:
                type: string
              status:
                type: string
                enum: [synced, drift, error, skipped]
              error:
                type: string
              drift_summary:
                type: string
              difference_count:
                type: integer
              drift:
                type: object
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration:
          type: integer
          description: Nanoseconds.

    APIError:
      type: object
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - VALIDATION_FAILED
            - RATE_LIMIT_EXCEEDED
            - REQUEST_TOO_LARGE
            - INTERNAL_SERVER_ERROR
            - DEVICE_NOT_FOUND
            - DEVICE_OFFLINE
            - CONFIGURATION_ERROR
            - TEMPLATE_ERROR
            - EXTERNAL_SERVICE_ERROR
            - NOT_IMPLEMENTED
            - UNSUPPORTED_MEDIA_TYPE
            - REQUEST_TIMEOUT
            - IP_BLOCKED
        message:
          type: string
        details:
          type: object

    Metadata:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        count:
          type: integer
        total_count:
          type: integer
        version:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean

    # Device Models
    Device:
      type: object
      properties:
        id:
          type: integer
        ip:
          type: string
          format: ipv4
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        type:
          type: string
          example: SHSW-1
        name:
          type: string
        firmware:
          type: string
        status:
          type: string
          enum: [online, offline, unknown]
        last_seen:
          type: string
          format: date-time
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - mac

    DeviceCreate:
      type: object
      properties:
        ip:
          type: string
          format: ipv4
        mac:
          type: string
        type:
          type: string
        name:
          type: string
        firmware:
          type: string
        settings:
          type: object
      required:
        - mac

    DeviceUpdate:
      type: object
      properties:
        ip:
          type: string
          format: ipv4
        name:
          type: string
        firmware:
          type: string
        settings:
          type: object

    DeviceControl:
      type: object
      properties:
        action:
          type: string
          example: toggle
        params:
          type: object
      required:
        - action

    # Configuration Models
    DeviceConfig:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: integer
        template_id:
          type: integer
        config:
          type: object
        last_synced:
          type: string
          format: date-time
        sync_status:
          type: string
          enum: [synced, pending, error, drift]
          description: >-
            Import and restore state of the stored configuration, never drift. synced means an
            import from the device wrote it; pending means it waits to go to the device. error and
            drift are old values that nothing writes any more, and a row written before drift
            checks stopped storing their result can still hold one. Drift is read only from
            GET /api/v1/devices/{id}/config/drift.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Template Models
    ConfigTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        device_type:
          type: string
        generation:
          type: integer
          enum: [0, 1, 2]
        config:
          type: object
        variables:
          type: object
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConfigTemplateCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        device_type:
          type: string
        generation:
          type: integer
        config:
          type: object
        variables:
          type: object
        is_default:
          type: boolean
      required:
        - name
        - config

    ApplyTemplateRequest:
      type: object
      properties:
        template_id:
          type: integer
        variables:
          type: object
      required:
        - template_id

    PreviewTemplateRequest:
      type: object
      properties:
        template:
          type: string
        variables:
          type: object
      required:
        - template

    # Drift Models
    ConfigDrift:
      type: object
      properties:
        device_id:
          type: integer
        device_name:
          type: string
        last_synced:
          type: [string, 'null']
          format: date-time
          description: >-
            Always null: drift compares with the desired configuration, which
            has no sync time.
        drift_detected:
          type: string
          format: date-time
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDifference'
        requires_action:
          type: boolean

    ConfigDifference:
      type: object
      properties:
        path:
          type: string
        expected:
          type: object
        actual:
          type: object
        type:
          type: string
          enum: [added, removed, modified]
        severity:
          type: string
          enum: [critical, warning, info]
        category:
          type: string
          enum: [security, network, device, system, metadata]
        description:
          type: string
        impact:
          type: string
        suggestion:
          type: string

    DriftSchedule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        cron:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Export/Import Models
    ExportRequest:
      type: object
      properties:
        plugin_name:
          type: string
          enum: [json, yaml, sma, gitops]
        format:
          type: string
        config:
          type: object
        filters:
          $ref: '#/components/schemas/ExportFilters'
        output:
          $ref: '#/components/schemas/OutputConfig'
        options:
          $ref: '#/components/schemas/ExportOptions'

    ExportFilters:
      type: object
      properties:
        device_ids:
          type: array
          items:
            type: integer
        device_types:
          type: array
          items:
            type: string
        time_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time

    OutputConfig:
      type: object
      properties:
        type:
          type: string
          enum: [file, webhook, database]
        path:
          type: string

    ExportOptions:
      type: object
      properties:
        compression:
          type: string
          enum: [gzip, zip, none]
        include_metadata:
          type: boolean
        encryption:
          type: object
          properties:
            algorithm:
              type: string
            key_path:
              type: string

    ExportResult:
      type: object
      properties:
        success:
          type: boolean
        export_id:
          type: string
        plugin_name:
          type: string
        format:
          type: string
        output_path:
          type: string
        webhook_sent:
          type: boolean
        record_count:
          type: integer
        file_size:
          type: integer
          format: int64
        checksum:
          type: string
        duration:
          type: integer
          format: int64
          description: Duration in nanoseconds
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    ImportRequest:
      type: object
      properties:
        plugin_name:
          type: string
        format:
          type: string
        source:
          $ref: '#/components/schemas/ImportSource'
        config:
          type: object
        options:
          $ref: '#/components/schemas/ImportOptions'

    ImportSource:
      type: object
      properties:
        type:
          type: string
          enum: [file, webhook, database]
        path:
          type: string
        url:
          type: string

    ImportOptions:
      type: object
      properties:
        dry_run:
          type: boolean
        validate_only:
          type: boolean
        skip_errors:
          type: boolean

    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        import_id:
          type: string
        plugin_name:
          type: string
        format:
          type: string
        records_imported:
          type: integer
        records_skipped:
          type: integer
        duration:
          type: integer
          format: int64
          description: Duration in nanoseconds
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ImportChange'
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    ImportChange:
      type: object
      properties:
        type:
          type: string
          enum: [create, update, delete]
        resource:
          type: string
          description: device, config or template
        resource_id:
          type: string
        field:
          type: string
        old_value: {}
        new_value: {}

    BackupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        format:
          type: string
          default: sma
        devices:
          type: array
          items:
            type: integer
        config:
          type: object
        filters:
          $ref: '#/components/schemas/ExportFilters'
        options:
          $ref: '#/components/schemas/ExportOptions'

    # Notification Models
    NotificationChannel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [email, webhook, slack, discord]
        enabled:
          type: boolean
        config:
          type: object
          description: >-
            The channel configuration. The value under every credential key in it (url, webhook_url,
            headers, and any key named like a secret), whatever its type, is sent as the placeholder
            ******** and never as the stored value. The same applies to the channel inside a rule or a
            history entry.
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationChannelCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [email, webhook, slack, discord]
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: >-
            The channel configuration. On an update, a credential key sent as the placeholder ********
            keeps its stored value; any other value (a string, an object or a list) replaces it. A
            credential left out is removed, because an update replaces the whole configuration.
        description:
          type: string
      required:
        - name
        - type
        - config

    NotificationRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        channel_id:
          type: integer
        alert_level:
          type: string
          enum: [critical, warning, info, all]
        min_severity:
          type: string
        categories:
          type: array
          items:
            type: string
        device_filter:
          type: object
        min_interval_minutes:
          type: integer
        max_per_hour:
          type: integer
        schedule_enabled:
          type: boolean
        schedule_start:
          type: string
        schedule_end:
          type: string
        schedule_days:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Provisioner Models
    ProvisionerAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        last_seen:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string

    ProvisioningTask:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        device_id:
          type: integer
        agent_id:
          type: string
        config:
          type: object
        result:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiscoverRequest:
      type: object
      properties:
        network:
          type: string
        import_config:
          type: boolean

    # Metrics Models
    DashboardMetrics:
      type: object
      properties:
        devices_online:
          type: integer
        devices_offline:
          type: integer
        drift_detected:
          type: integer
        recent_exports:
          type: integer
        recent_imports:
          type: integer
        notifications_sent:
          type: integer

    # Health Models
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]

    VersionInfo:
      type: object
      description: The `data` payload of the version response
      required: [api_version, server_started_at]
      properties:
        api_version:
          type: string
        server_started_at:
          type: string
          format: date-time
        git_sha:
          type: string
          description: The git revision the server binary was built from. Empty when the build carries no version control information (for example `go run` or `-buildvcs=false`). The web UI compares it with its own build revision.
        database_provider_name:
          type: string
          description: Present when the database layer reports its provider
        database_provider_version:
          type: string
          description: Present when the database layer reports its provider

paths:
  # Health Endpoints
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /version:
    get:
      tags: [Health]
      summary: Get API version
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VersionInfo'

  /api/v1/version:
    get:
      tags: [Health]
      summary: Get API version (the path the web UI uses)
      operationId: getAPIVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VersionInfo'

  # Device Endpoints
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List all devices
      operationId: listDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items:
                              $ref: '#/components/schemas/Device'

    post:
      tags: [Devices]
      summary: Add a new device
      operationId: addDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'

  /api/v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Devices]
      summary: Get a device by ID
      operationId: getDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'
        '404':
          description: Device not found

    put:
      tags: [Devices]
      summary: Update a device
      description: >-
        Saves the device's own fields. The save is versioned: a body with updated_at must carry the
        stored value (409 CONFLICT otherwise), and a body without it is saved against the row the
        server reads when the save starts. template_ids, overrides, desired_config and config_applied are read-only here:
        a body that carries them changes none of them. Set template_ids with
        PUT /api/v1/devices/{id}/templates/new, overrides with PUT or PATCH
        /api/v1/devices/{id}/overrides/new, and config_applied with
        POST /api/v1/devices/{id}/config/new/apply. desired_config is derived from the templates and
        overrides (read it with GET /api/v1/devices/{id}/desired-config).
      operationId: updateDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'

    delete:
      tags: [Devices]
      summary: Delete a device
      operationId: deleteDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '204':
          description: Device deleted

  /api/v1/devices/{id}/control:
    post:
      tags: [Devices]
      summary: Control a device
      operationId: controlDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceControl'
      responses:
        '200':
          description: Control action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid device ID or JSON, or a `channel` parameter of an `on`, `off` or `toggle` action that is not a whole number of 0 or more (VALIDATION_FAILED); no device is called
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device at the stored address is not the stored device: its MAC differs, it
            reports none, or the record has none (CONFLICT). The command is not sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/status:
    get:
      tags: [Devices]
      summary: Get device status
