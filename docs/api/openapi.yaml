      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProvisionerAgent'

  /api/v1/provisioner/agents/{id}:
    delete:
      tags: [Provisioning]
      summary: Delete provisioner agent
      description: >-
        Frees the agent's id at once and revokes its token. Its `assigned` and `in_progress` tasks become `failed`
        with `config._error`; its `pending` tasks stay. Admin key only.
      operationId: deleteProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The agent id. It may hold a `/`, sent as it is or as `%2F`.
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: No agent has this id.

  /api/v1/provisioner/agents/{id}/approve:
    post:
      tags: [Provisioning]
      summary: Approve a provisioner agent's key
      description: >-
        Takes a `pending` or `rejected` agent to `approved`, or a `rejected` agent that never had a key to
        `preapproved`. It issues no token: the agent gets one by a signed register. Any other state, a `legacy` row
        included, answers `409`. Admin key only.
      operationId: approveProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The agent id. It may hold a `/`, sent as it is or as `%2F`.
          schema:
            type: string
      responses:
        '200':
          description: The agent in its new state, under `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisionerAgent'
        '404':
          description: No agent has this id.
        '409':
          description: The agent's enrolment state does not allow this.

  /api/v1/provisioner/agents/{id}/reject:
    post:
      tags: [Provisioning]
      summary: Reject a provisioner agent
      description: >-
        Takes a `pending`, `preapproved` or `approved` agent to `rejected`. The agent's token stops working at once,
        its challenge is cleared and its `assigned` and `in_progress` tasks become `failed` with `config._error`;
        its `pending` tasks stay. The row stays, so the agent does not return as `pending`. Any other state, a
        `legacy` row included, answers `409`. Admin key only.
      operationId: rejectProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The agent id. It may hold a `/`, sent as it is or as `%2F`.
          schema:
            type: string
      responses:
        '200':
          description: The agent in its new state, under `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisionerAgent'
        '404':
          description: No agent has this id.
        '409':
          description: The agent's enrolment state does not allow this.

  /api/v1/provisioner/enrolments:
    post:
      tags: [Provisioning]
      summary: Pre-approve a key by its fingerprint
      description: >-
        Names a fingerprint ahead of its agent. It creates a `preapproved` row, or approves the `pending` row that
        has the fingerprint. A fingerprint whose row is in any other state answers `409`. Admin key only.
      operationId: preapproveProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint:
                  type: string
                  description: >-
                    32 hexadecimal characters, or eight groups of four joined by hyphens, in either case.
      responses:
        '201':
          description: A `preapproved` row was created, under `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisionerAgent'
        '200':
          description: The `pending` row with this fingerprint was approved, under `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisionerAgent'
        '400':
          description: The fingerprint is not 32 hexadecimal characters.
        '409':
          description: The fingerprint has a row that is not `pending`.

  /api/v1/provisioner/agents/register:
    post:
      tags: [Provisioning]
      summary: Register provisioner agent
      operationId: registerProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProvisionerAgent'
                - type: object
                  properties:
                    public_key:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                      description: >-
                        The agent's Ed25519 public key, 32 bytes as lowercase hexadecimal. Makes the request a keyed
                        register: `id` must then be `keyed-` and the fingerprint of this key.
                    signature:
                      type: string
                      pattern: '^[0-9a-f]{128}$'
                      description: >-
                        Ed25519 signature, as lowercase hexadecimal, over the ASCII text `shelly-manager provisioner
                        register v1`, a zero byte, the agent id, a zero byte and the 32 decoded bytes of the
                        challenge the manager last gave this agent. Omit it to ask for a challenge.
      responses:
        '200':
          description: >-
            A keyed register that issued no token. `data.status` is `pending` (the row waits for the operator),
            `challenge` (the row is approved or preapproved: `data.challenge` is 64 hexadecimal characters, valid
            60 seconds, to sign and send back) or `rejected`. `data` also has `agent_id`, the readable
            `fingerprint` and a `message`; it never carries a token or a key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '201':
          description: >-
            Agent registered. `data.agent_token` is the agent's own token, sent as `X-Agent-Token` on poll, task
            status and report. A new registration of the same id replaces it. A keyed register gets it only with a
            good signature, and `data` then also has `agent_id`, `registered_at` and `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: >-
            The request is refused. Either the id starts with `keyed-` in any case without a public key (that prefix
            is reserved for agents enrolled by key), or it would create a new agent and holds a space or a byte
            outside printable ASCII (`0x21` to `0x7E`) without starting with `provisioner-`, or a register
            without a public key holds a NUL character in the id (new or existing), hostname, version,
            capabilities or metadata, or a keyed register
            has a `public_key` or `signature` of the wrong length, upper case or not hexadecimal, an id that the
            key does not derive, or a NUL character in the hostname, version, capabilities or metadata. No agent is
            created.
        '401':
          description: >-
            A signed register with no stored challenge, an expired or already used one, a key that is not the
            row's, or a signature that does not verify. Nothing is written, and a bad signature does not spend the
            challenge.
        '403':
          description: >-
            A register without a `public_key` while the manager runs `security.agent_enrolment: strict`, for the agent
            key and the admin key alike. No row is written and no token is issued. A keyed register is not affected.
        '409':
          description: >-
            The id is online (seen within 5 minutes) and the request carries neither that agent's token nor the
            admin key, or the id belongs to an agent enrolled by key (any state but legacy), which no keyless
            register replaces, the admin key included. A keyed register that finds a `legacy` row at its id is a
            `409` too.
        '429':
          description: >-
            A keyed register of a new key while 20 agents already wait for the operator. No row is created. The cap
            is soft: registers that arrive at the same moment can take it a little past 20.

  /api/v1/provisioner/agents/{id}/tasks:
    get:
      tags: [Provisioning]
      summary: Poll tasks for agent
      operationId: pollAgentTasks
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
