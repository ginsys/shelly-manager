  /api/v1/provisioner/tasks/{id}/status:
    put:
      tags: [Provisioning]
      summary: Update task status
      operationId: updateTaskStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
