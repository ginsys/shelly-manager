openapi: 3.1.0
info:
  title: Shelly Manager API
  description: |
    Comprehensive API for managing Shelly smart home devices.

    Features include:
    - Device discovery and management
    - Configuration templates and drift detection
    - Export/Import in multiple formats (JSON, YAML, SMA, GitOps)
    - Real-time metrics via WebSocket
    - Multi-channel notifications
    - Provisioner agent management
  version: 1.0.0
  contact:
    name: Shelly Manager
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://shelly.example.com
    description: Production server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Devices
    description: Device management operations
  - name: Configuration
    description: Device configuration management
  - name: Templates
    description: Configuration templates
  - name: Drift
    description: Configuration drift detection
  - name: Export
    description: Export and backup operations
  - name: Import
    description: Import and restore operations
  - name: Notifications
    description: Notification channels and rules
  - name: Metrics
    description: Metrics and monitoring
  - name: Provisioning
    description: Device discovery and provisioning
  - name: Admin
    description: Administrative operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    AgentToken:
      name: X-Agent-Token
      in: header
      required: false
      description: >-
        The agent's own token, returned as `agent_token` when it registered. Needed with the agent key on the
        routes that act for one agent; the admin key needs none. Not checked when the manager has no admin key.
      schema:
        type: string

  schemas:
    # Common Response Wrapper
    APIResponse:
      type: object
      description: >-
        The envelope of a response. `success` and `timestamp` are always sent.
        `data` is left out when a route has nothing to return, `error` is sent
        on a failure only, and `meta` and `request_id` are optional.
      required: [success, timestamp]
      properties:
        success:
          type: boolean
        data:
          description: What the route returns, an object or on a list route an array.
        error:
          $ref: '#/components/schemas/APIError'
        meta:
          $ref: '#/components/schemas/Metadata'
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    # Bulk configuration routes (bulk-import, bulk-drift-detect,
    # bulk-drift-detect-enhanced, bulk-download, bulk-apply) act on the named devices only.
    BulkDeviceRequest:
      type: object
      additionalProperties: false
      required: [device_ids]
      properties:
        device_ids:
          type: array
          minItems: 1
          description: >-
            The devices to act on. Each id is a positive integer; a repeated id runs once, in
            first-seen order. A missing or empty list is refused, and no device is contacted.
          items:
            type: integer
            minimum: 1
        options:
          type: object
          additionalProperties: false
          properties:
            stop_on_error:
              type: boolean
              default: false
              description: >-
                After the first failed device the remaining devices are reported `skipped` and are
                not contacted.

    BulkConfigResult:
      type: object
      description: Answer of bulk-import, in the `data` member.
      properties:
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              device_ip:
                type: string
              config_id:
                type: integer
                description: The stored configuration the import wrote.
              status:
                type: string
                enum: [success, failed, skipped]
              error:
                type: string

    BulkDownloadRequest:
      type: object
      description: >-
        The request of bulk-download: the bulk request with a cap of 200 devices, and with
        `options.stop_on_error` limited to `false`, which is the same as leaving it out.
      additionalProperties: false
      required: [device_ids]
      properties:
        device_ids:
          type: array
          minItems: 1
          description: >-
            The devices to download. Each id is a positive integer; a repeated id counts once, in
            first-seen order. More than 200 distinct ids are refused, and nothing is read. The limit
            is on distinct ids, so the schema has no `maxItems`: it would refuse a list that
            repeats an id.
          items:
            type: integer
            minimum: 1
        options:
          type: object
          additionalProperties: false
          properties:
            stop_on_error:
              type: boolean
              enum: [false]
              description: A read has nothing to stop; `true` is refused with 400.

    BulkDownloadFile:
      type: object
      description: >-
        The file bulk-download answers. It is the body itself, not the `{success, data}` envelope.
      required: [generated_at, devices]
      properties:
        generated_at:
          type: string
          format: date-time
        devices:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            required: [device_id, status]
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              mac:
                type: string
              status:
                type: string
                enum: [ok, error]
              config:
                type: object
                description: >-
                  The desired configuration (templates and overrides merged), with every secret that
                  is set replaced by the mask `********`. Present when `status` is `ok`.
              error:
                type: string
                description: >-
                  A fixed text when `status` is `error`: `device not found`, `no desired
                  configuration is set for this device`, `the stored configuration has settings
                  this version does not know, so it cannot be downloaded completely` (a stored
                  field the typed configuration would drop, such as a legacy row restored by an
                  import: the entry is refused rather than returned incomplete) or `the
                  configuration could not be read`.

    BulkApplyRequest:
      type: object
      description: >-
        The request of bulk-apply: the bulk request with a cap of 10 devices and a `config`.
      additionalProperties: false
      required: [device_ids, config]
      properties:
        device_ids:
          type: array
          minItems: 1
          description: >-
            The devices to apply to. Each id is a positive integer; a repeated id counts once, in
            first-seen order. More than 10 distinct ids are refused, and nothing is read or written.
            The limit is on distinct ids, so the schema has no `maxItems`: it would refuse a list
            that repeats an id.
          items:
            type: integer
            minimum: 1
        config:
          type: object
          minProperties: 1
          description: >-
            A partial device configuration, the body of `PATCH /api/v1/devices/{id}/overrides/new`:
            stored as each named device's overrides (never as a template), omitted fields stay, a
            field sent as `null` removes its override, a secret sent as the mask `********` keeps
            the stored one. A field the typed configuration does not know is refused with 400. It
            is checked against the model of every selected device before the first write.
        options:
          type: object
          additionalProperties: false
          properties:
            stop_on_error:
              type: boolean
              default: false
              description: >-
                After the first device that does not end `applied`, the remaining devices are
                reported `skipped` and are not contacted. Devices already written stay written.

    BulkApplyResult:
      type: object
      description: Answer of bulk-apply, in the `data` member. The call is not atomic and rolls nothing back.
      required: [total, applied, pending, unconfirmed, refused, failed, skipped, results]
      properties:
        total:
          type: integer
        applied:
          type: integer
        pending:
          type: integer
        unconfirmed:
          type: integer
        refused:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            required: [device_id, status, stored, requires_reboot]
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              device_ip:
                type: string
              status:
                type: string
                enum: [applied, pending, unconfirmed, refused, failed, skipped]
                description: >-
                  `applied`: written and read back equal. `pending`: written and read back equal,
                  but the desired configuration changed while it ran, so the device stays pending.
                  `unconfirmed`: written, then the device stopped answering after a network change,
                  so it is not verified; it stays pending. `refused`: nothing was written to the
                  device. `failed`: the call did not end in a recorded, verified write. `skipped`:
                  not contacted.
              stored:
                type: boolean
                nullable: true
                description: >-
                  Whether the new overrides are stored. `null` where the storage call failed part
                  way and it is not known. A `refused` entry with `stored: true` was refused by the
                  apply after the overrides were stored: the device was not written to, and it
                  stays pending.
              reason:
                type: string
                description: >-
                  One fixed text per cause. It names what happened and never a value or the text of
                  a device error.
              failures:
                type: array
                description: >-
                  Settings by path only, such as `mqtt.server: the device holds a different value`.
                  No value is in the list.
                items:
                  type: string
              requires_reboot:
                type: boolean

    BulkDriftResult:
      type: object
      description: Answer of bulk-drift-detect, in the `data` member.
      properties:
        total:
          type: integer
        in_sync:
          type: integer
        drifted:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
        results:
          type: array
          description: One entry per named device, in request order.
          items:
            type: object
            properties:
              device_id:
                type: integer
              device_name:
                type: string
              device_ip:
                type: string
              status:
                type: string
                enum: [synced, drift, error, skipped]
              error:
                type: string
              drift_summary:
                type: string
              difference_count:
                type: integer
              drift:
                type: object
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration:
          type: integer
          description: Nanoseconds.

    APIError:
      type: object
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - VALIDATION_FAILED
            - RATE_LIMIT_EXCEEDED
            - REQUEST_TOO_LARGE
            - INTERNAL_SERVER_ERROR
            - DEVICE_NOT_FOUND
            - DEVICE_OFFLINE
            - DEVICE_UNREACHABLE
            - CONFIGURATION_ERROR
            - TEMPLATE_ERROR
            - EXTERNAL_SERVICE_ERROR
            - NOT_IMPLEMENTED
            - UNSUPPORTED_MEDIA_TYPE
            - REQUEST_TIMEOUT
        message:
          type: string
        details:
          type: object

    Metadata:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        count:
          type: integer
        total_count:
          type: integer
        version:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean

    # Device Models
    Device:
      type: object
      properties:
        id:
          type: integer
        ip:
          type: string
          format: ipv4
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        type:
          type: string
          example: SHSW-1
        name:
          type: string
        firmware:
          type: string
        status:
          type: string
          enum: [online, offline, unknown]
        last_seen:
          type: string
          format: date-time
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - mac

    DeviceCreate:
      type: object
      properties:
        ip:
          type: string
          format: ipv4
        mac:
          type: string
        type:
          type: string
        name:
          type: string
        firmware:
          type: string
        settings:
          type: object
      required:
        - mac

    DeviceUpdate:
      type: object
      properties:
        ip:
          type: string
          format: ipv4
        name:
          type: string
        firmware:
          type: string
        settings:
          type: object

    DeviceControl:
      type: object
      properties:
        action:
          type: string
          example: toggle
        params:
          type: object
        force:
          type: boolean
          default: false
          description: >-
            Control a device that is marked offline anyway. Without it, a request for an
            offline device is answered 503 (DEVICE_OFFLINE) and nothing is sent.
      required:
        - action

    # Configuration Models
    DeviceConfig:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: integer
        template_id:
          type: integer
        config:
          type: object
        last_synced:
          type: string
          format: date-time
        sync_status:
          type: string
          enum: [synced, pending, error, drift]
          description: >-
            Import and restore state of the stored configuration, never drift. synced means an
            import from the device wrote it; pending means it waits to go to the device. error and
            drift are old values that nothing writes any more, and a row written before drift
            checks stopped storing their result can still hold one. Drift is read only from
            GET /api/v1/devices/{id}/config/drift.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Template Models
    ConfigTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        device_type:
          type: string
        generation:
          type: integer
          enum: [0, 1, 2]
        config:
          type: object
        variables:
          type: object
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConfigTemplateCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        device_type:
          type: string
        generation:
          type: integer
        config:
          type: object
        variables:
          type: object
        is_default:
          type: boolean
      required:
        - name
        - config

    ApplyTemplateRequest:
      type: object
      properties:
        template_id:
          type: integer
        variables:
          type: object
      required:
        - template_id

    PreviewTemplateRequest:
      type: object
      properties:
        template:
          type: string
        variables:
          type: object
      required:
        - template

    # Drift Models
    ConfigDrift:
      type: object
      properties:
        device_id:
          type: integer
        device_name:
          type: string
        last_synced:
          type: [string, 'null']
          format: date-time
          description: >-
            Always null: drift compares with the desired configuration, which
            has no sync time.
        drift_detected:
          type: string
          format: date-time
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDifference'
        requires_action:
          type: boolean

    ConfigDifference:
      type: object
      properties:
        path:
          type: string
        expected:
          type: object
        actual:
          type: object
        type:
          type: string
          enum: [added, removed, modified]
        severity:
          type: string
          enum: [critical, warning, info]
        category:
          type: string
          enum: [security, network, device, system, metadata]
        description:
          type: string
        impact:
          type: string
        suggestion:
          type: string

    DriftSchedule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        cron_spec:
          type: string
          description: Five-field cron (minute hour day-of-month month day-of-week), in the server's time zone.
        device_ids:
          type: array
          items:
            type: integer
          description: The devices the schedule checks. Empty with no device_filter means every device.
        device_filter:
          $ref: '#/components/schemas/DriftDeviceFilter'
        last_run:
          type: [string, 'null']
          format: date-time
        next_run:
          type: [string, 'null']
          format: date-time
          description: Null while the schedule is disabled.
        run_count:
          type: integer
          description: Ticks the scheduler has claimed for this schedule, runs and skipped ticks alike.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          description: >-
            Moves on every write of the schedule by a user (an update or a toggle) and when the scheduler
            disables it after a failure; a scheduler run does not move it. An update sends the revision it
            read, and the server refuses it with 409 when the stored one is not that.

    DriftRun:
      type: object
      description: One run of a drift schedule, as the run list returns it.
      properties:
        id:
          type: integer
        schedule_id:
          type: integer
        status:
          type: string
          description: >-
            running, completed, failed, interrupted, or skipped (a tick that found the previous
            run of the schedule still running; it carries an error text saying so).
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
          description: Null while the run is running.
        duration:
          type: [integer, 'null']
          description: Nanoseconds (a Go time.Duration), null while the run is running.
        error:
          type: string
          description: Absent unless the run failed, was interrupted or was skipped; then it says why.
        created_at:
          type: string
          format: date-time
        results:
          type: object
          description: The result document of the run. The run list never carries it, so this property is absent there.

    DriftDeviceFilter:
      type: [object, 'null']
      additionalProperties: false
      description: Selects devices by column. A key other than these is refused.
      properties:
        type:
          type: string
        status:
          type: string

    DriftScheduleInput:
      type: object
      additionalProperties: false
      required: [name, cron_spec]
      properties:
        name:
          type: string
        description:
          type: string
        cron_spec:
          type: string
          example: '*/5 * * * *'
          description: >-
            Exactly five fields. A sixth field, a descriptor such as @hourly, a TZ= prefix
            and a spec that never fires (0 0 30 2 *) are refused.
        enabled:
          type: boolean
          description: Defaults to true on create and stays as it is on update.
        device_ids:
          type: array
          items:
            type: integer
          description: Must exist. Not allowed together with device_filter.
        device_filter:
          $ref: '#/components/schemas/DriftDeviceFilter'

    DriftScheduleUpdate:
      type: object
      additionalProperties: false
      required: [name, cron_spec, revision]
      description: >-
        The body of an update. It holds the fields of DriftScheduleInput and the revision the caller read.
      properties:
        name:
          type: string
        description:
          type: string
        cron_spec:
          type: string
          example: '*/5 * * * *'
        enabled:
          type: boolean
          description: Stays as it is when it is left out.
        device_ids:
          type: array
          items:
            type: integer
        device_filter:
          $ref: '#/components/schemas/DriftDeviceFilter'
        revision:
          type: integer
          description: The `revision` of the schedule as the caller read it. A body without it is refused with 400.

    DriftScheduleResponse:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DriftSchedule'

    # Export/Import Models
    ExportRequest:
      type: object
      properties:
        plugin_name:
          type: string
          enum: [json, yaml, sma, gitops]
        format:
          type: string
        config:
          type: object
        filters:
          $ref: '#/components/schemas/ExportFilters'
        output:
          $ref: '#/components/schemas/OutputConfig'
        options:
          $ref: '#/components/schemas/ExportOptions'

    ExportFilters:
      type: object
      properties:
        device_ids:
          type: array
          items:
            type: integer
        device_types:
          type: array
          items:
            type: string
        time_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time

    OutputConfig:
      type: object
      properties:
        type:
          type: string
          enum: [file, webhook, database]
        path:
          type: string

    ExportOptions:
      type: object
      properties:
        compression:
          type: string
          enum: [gzip, zip, none]
        include_metadata:
          type: boolean
        encryption:
          type: object
          properties:
            algorithm:
              type: string
            key_path:
              type: string

    ExportResult:
      type: object
      properties:
        success:
          type: boolean
        export_id:
          type: string
        plugin_name:
          type: string
        format:
          type: string
        output_path:
          type: string
        webhook_sent:
          type: boolean
        record_count:
          type: integer
        file_size:
          type: integer
          format: int64
        checksum:
          type: string
        duration:
          type: integer
          format: int64
          description: Duration in nanoseconds
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    ImportRequest:
      type: object
      properties:
        plugin_name:
          type: string
        format:
          type: string
        source:
          $ref: '#/components/schemas/ImportSource'
        config:
          type: object
        options:
          $ref: '#/components/schemas/ImportOptions'

    ImportSource:
      type: object
      properties:
        type:
          type: string
          enum: [file, webhook, database]
        path:
          type: string
        url:
          type: string

    ImportOptions:
      type: object
      properties:
        dry_run:
          type: boolean
        validate_only:
          type: boolean
        skip_errors:
          type: boolean

    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        import_id:
          type: string
        plugin_name:
          type: string
        format:
          type: string
        records_imported:
          type: integer
        records_skipped:
          type: integer
        duration:
          type: integer
          format: int64
          description: Duration in nanoseconds
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ImportChange'
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    ImportChange:
      type: object
      properties:
        type:
          type: string
          enum: [create, update, delete]
        resource:
          type: string
          description: device, config or template
        resource_id:
          type: string
        field:
          type: string
        old_value: {}
        new_value: {}

    BackupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        format:
          type: string
          default: sma
        devices:
          type: array
          items:
            type: integer
        config:
          type: object
        filters:
          $ref: '#/components/schemas/ExportFilters'
        options:
          $ref: '#/components/schemas/ExportOptions'

    # Notification Models
    NotificationChannel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [email, webhook, slack, discord]
        enabled:
          type: boolean
        config:
          type: object
          description: >-
            The channel configuration. The value under every credential key in it (url, webhook_url,
            headers, and any key named like a secret), whatever its type, is sent as the placeholder
            ******** and never as the stored value. The same applies to the channel inside a rule or a
            history entry.
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationChannelCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [email, webhook, slack, discord]
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: >-
            The channel configuration. On an update, a credential key sent as the placeholder ********
            keeps its stored value; any other value (a string, an object or a list) replaces it. A
            credential left out is removed, because an update replaces the whole configuration.
        description:
          type: string
      required:
        - name
        - type
        - config

    NotificationRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        channel_id:
          type: integer
        alert_level:
          type: string
          enum: [critical, warning, info, all]
        min_severity:
          type: string
        categories:
          type: array
          items:
            type: string
        device_filter:
          type: object
        min_interval_minutes:
          type: integer
        max_per_hour:
          type: integer
        schedule_enabled:
          type: boolean
        schedule_start:
          type: string
        schedule_end:
          type: string
        schedule_days:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Provisioner Models
    ProvisionerAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        last_seen:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
        enrolment_state:
          type: string
          enum: [legacy, pending, preapproved, approved, rejected]
          description: >-
            Where the agent is in enrolment by key. A row with no state reads `legacy`. Each admin transition stores
            the state name as the agent's `status`, and a register or poll stores `online`. The list shows `offline`
            for any agent not seen for five minutes, whatever is stored, so a row that nobody has registered shows
            `offline` soon after its transition. A pending, preapproved or rejected row never counts as an active
            agent.
        fingerprint:
          type: string
          description: >-
            The fingerprint of the agent's key as eight groups of four hexadecimal characters joined by hyphens, for
            an agent enrolled by key. Absent for a `legacy` row. The key itself is never returned.

    ProvisioningTask:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        device_id:
          type: integer
        agent_id:
          type: string
        config:
          type: object
        result:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiscoverRequest:
      type: object
      properties:
        network:
          type: string
        import_config:
          type: boolean

    # Metrics Models
    DashboardMetrics:
      type: object
      properties:
        devices_online:
          type: integer
        devices_offline:
          type: integer
        drift_detected:
          type: integer
        recent_exports:
          type: integer
        recent_imports:
          type: integer
        notifications_sent:
          type: integer

    # Health Models
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]

    VersionInfo:
      type: object
      description: The `data` payload of the version response
      required: [api_version, server_started_at]
      properties:
        api_version:
          type: string
        server_started_at:
          type: string
          format: date-time
        git_sha:
          type: string
          description: The git revision the server binary was built from. Empty when the build carries no version control information (for example `go run` or `-buildvcs=false`). The web UI compares it with its own build revision.
        database_provider_name:
          type: string
          description: Present when the database layer reports its provider
        database_provider_version:
          type: string
          description: Present when the database layer reports its provider

paths:
  # Health Endpoints
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /version:
    get:
      tags: [Health]
      summary: Get API version
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VersionInfo'

  /api/v1/version:
    get:
      tags: [Health]
      summary: Get API version (the path the web UI uses)
      operationId: getAPIVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VersionInfo'

  # Device Endpoints
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List all devices
      operationId: listDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items:
                              $ref: '#/components/schemas/Device'

    post:
      tags: [Devices]
      summary: Add a new device
      operationId: addDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'

  /api/v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Devices]
      summary: Get a device by ID
      operationId: getDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'
        '404':
          description: Device not found

    put:
      tags: [Devices]
      summary: Update a device
      description: >-
        Saves the device's own fields. The save is versioned: a body with updated_at must carry the
        stored value (409 CONFLICT otherwise), and a body without it is saved against the row the
        server reads when the save starts. template_ids, overrides, desired_config and config_applied are read-only here:
        a body that carries them changes none of them. Set template_ids with
        PUT /api/v1/devices/{id}/templates/new, overrides with PUT or PATCH
        /api/v1/devices/{id}/overrides/new, and config_applied with
        POST /api/v1/devices/{id}/config/new/apply. desired_config is derived from the templates and
        overrides (read it with GET /api/v1/devices/{id}/desired-config).
      operationId: updateDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'

    delete:
      tags: [Devices]
      summary: Delete a device
      operationId: deleteDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '204':
          description: Device deleted

  /api/v1/devices/{id}/control:
    post:
      tags: [Devices]
      summary: Control a device
      operationId: controlDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceControl'
      responses:
        '200':
          description: Control action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid device ID or JSON, or a `channel` parameter of an `on`, `off` or `toggle` action that is not a whole number of 0 or more (VALIDATION_FAILED); no device is called
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device at the stored address is not the stored device: its MAC differs, it
            reports none, or the record has none (CONFLICT). The command is not sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '503':
          description: >-
            The stored device is marked offline and the request does not set `force` to true
            (error code DEVICE_OFFLINE). Nothing is sent to the device. Repeat the request with
            `"force": true` to try anyway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/status:
    get:
      tags: [Devices]
      summary: Get device status
      operationId: getDeviceStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (error code EXTERNAL_SERVICE_ERROR).
            Store the right login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device refuses the stored login and the device at the stored address is not
            the stored device (error code CONFLICT). Its MAC differs, it reports none, or the
            record has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '503':
          description: >-
            The stored device is marked offline (error code DEVICE_OFFLINE). A device last seen
            within 5 minutes is probed once first, for up to 3 seconds, and this answer follows
            if that probe fails or cannot be set up. For any other offline device nothing is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '504':
          description: >-
            The device did not answer in time (error code DEVICE_UNREACHABLE).
            The message names the device and its address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/energy:
    get:
      tags: [Devices]
      summary: Get device energy metrics
      operationId: getDeviceEnergy
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Energy metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (error code EXTERNAL_SERVICE_ERROR).
            Store the right login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device refuses the stored login and the device at the stored address is not
            the stored device (error code CONFLICT). Its MAC differs, it reports none, or the
            record has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '503':
          description: >-
            The stored device is marked offline (error code DEVICE_OFFLINE). Nothing is sent
            to the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '504':
          description: >-
            The device did not answer in time (error code DEVICE_UNREACHABLE).
            The message names the device and its address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # Configuration Endpoints
  /api/v1/devices/{id}/config:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Configuration]
      summary: Get device configuration
      operationId: getDeviceConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Device configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceConfig'

    put:
      tags: [Configuration]
      summary: Update device configuration
      operationId: updateDeviceConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/current:
    get:
      tags: [Configuration]
      summary: Get current live configuration from device
      operationId: getCurrentDeviceConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            Current device configuration. The standard envelope carries the
            configuration record as `data`; its `config` member holds the
            settings read from the device. The read stores nothing: the
            stored configuration, its sync status and the history stay as they
            were (use POST /api/v1/devices/{id}/config/import to store the
            device's state as the stored configuration). The record is returned as it
            is: this route does not mask secrets (tracked in
            ginsys/shelly-manager#436).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (error code EXTERNAL_SERVICE_ERROR).
            Store the right login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device refuses the stored login and the device at the stored address is not
            the stored device (error code CONFLICT). Its MAC differs, it reports none, or the
            record has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '504':
          description: >-
            The device did not answer in time (error code DEVICE_UNREACHABLE).
            The message names the device and its address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/current/normalized:
    get:
      tags: [Configuration]
      summary: Get current live configuration from device, normalized
      operationId: getCurrentDeviceConfigNormalized
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            Normalized current device configuration. The read stores nothing:
            the stored configuration, its sync status and the history stay as
            they were.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: The `id` is not a number (BAD_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (error code EXTERNAL_SERVICE_ERROR).
            Store the right login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device refuses the stored login and the device at the stored address is not
            the stored device (error code CONFLICT). Its MAC differs, it reports none, or the
            record has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '504':
          description: >-
            The device did not answer in time (error code DEVICE_UNREACHABLE).
            The message names the device and its address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/auth:
    put:
      tags: [Configuration]
      summary: Store the login the manager uses to reach the device
      operationId: updateDeviceAuth
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: An empty username turns device auth off.
                password:
                  type: string
                  description: Required when username is set.
      responses:
        '200':
          description: Login stored; a cached device client is dropped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid device ID or JSON, or a username without a password (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/desired-config:
    get:
      tags: [Configuration]
      summary: Get the desired configuration of a device and what it inherits from its templates
      operationId: getDeviceDesiredConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds config and sources (the composed result of the templates and the device
            overrides, with the layer each value comes from), and inherited and inherited_sources
            (the template layers alone, which is what a field falls back to when its override is
            removed). A field that a template and an override both set shows only the override in
            config, and the template value in inherited. In config a set secret is removed. In
            inherited a set secret shows as the mask "********", never as its value. The
            set-templates route (PUT /api/v1/devices/{id}/templates/new) returns the same
            inherited and inherited_sources beside its desired_config and sources, and removes
            the set secrets from desired_config as well.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid device ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/desired-config/history:
    get:
      tags: [Configuration]
      summary: List the versions of the desired configuration of a device
      operationId: getDeviceDesiredHistory
      description: >-
        Needs the admin key when the server has one configured. The last 50 versions, newest
        first. A rollback is one of them, with action "rollback".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data.history is a list of id, created_at, action (recompute, import or rollback),
            changed_by, restored_from (the version a rollback restored, else null) and
            new_desired (the stored text of that version, with every secret masked as
            "********", or null where no text could be stored: a version with a null
            new_desired cannot be rolled back to, and the rollback route answers 422).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid device ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/new/rollback:
    post:
      tags: [Configuration]
      summary: Make a stored version the desired configuration of a device
      operationId: rollbackDeviceDesiredConfig
      description: >-
        Needs the admin key when the server has one configured. No device is contacted: the
        device keeps what it has until an apply, and is shown as pending. The version becomes the
        whole overrides text, the templates are detached, and the desired configuration is
        recomputed from it. A history row with action "rollback" is written with it. A rollback
        to what the device already holds writes nothing.

        A history version holds no secret, so a secret is kept from the current desired
        configuration only where the place it is sent to is unchanged: wifi.password while
        wifi.ssid is equal, wifi.ap.pass while wifi.ap.ssid is equal, mqtt.pass while mqtt.server,
        port, user, ssl_ca and enable_sni are equal, auth.pass while auth.user is equal, and
        the two network.wifi passwords while their ssid is equal. wifi.ap.key and every action
        URL list are always entered by the operator. For every other secret the route answers 409
        with the paths, and the retry carries them in secrets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [history_id]
              properties:
                history_id:
                  type: integer
                  description: A version of this device, from the history route.
                secrets:
                  type: object
                  description: >-
                    The secrets the 409 listed, keyed by its paths (mqtt.pass). A value is a
                    non-empty string, or for an action URL list (actions."<name>".<index>.secret_urls)
                    a non-empty list of non-empty strings. The mask, an empty value, an empty
                    list, a key that is not on the list, or secrets that is null or not an object is 400. A value is never logged,
                    echoed or stored in the history.
                  additionalProperties: true
      responses:
        '200':
          description: >-
            data holds version_id, no_change, detached_template_ids and message: "Desired
            configuration set to version N. The device is unchanged until you apply it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: >-
            Invalid device ID, or a body that is not a JSON object with a non-zero history_id
            and no repeated member, or secrets that are not an answer to the list. The answer
            never repeats a value that was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found, or the version is not one of this device's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            Either the version holds secrets that must be entered (error.details.paths lists the
            keys, nothing was written and no value is echoed), or the desired configuration
            changed while the rollback was prepared: read it again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '422':
          description: >-
            The version cannot be restored as it is: it holds no stored text, recomputing it
            would change it (error.details.paths names the places), or it holds a mask at a path
            that is no secret slot (error.details.paths names it; nothing can be entered for it,
            so it is never a 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/new/status:
    get:
      tags: [Configuration]
      summary: Get whether the desired configuration is applied
      operationId: getDeviceNewConfigStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds device_id, config_applied, has_overrides, template_count,
            last_applied (the time the device row last changed, also for a device that was
            never applied) and pending_changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/new/apply:
    post:
      tags: [Configuration]
      summary: Write the desired configuration to a Gen1, Gen2 or Gen3 device, read it back and compare
      description: >-
        Needs the admin key when the server has one configured; with no admin key configured
        the route is open. Takes no request body. Before it marks or writes anything it reads
        the MAC the device at the stored address reports and compares it with the stored MAC
        (case and the separators colon, dash and dot are ignored); a different MAC, a device
        that reports none, or a record with no MAC is refused with 409 and nothing is written,
        so an address that now leads to another device never receives this device's
        configuration. Clears config_applied before the write
        and sets it again only if the read-back matches and the desired configuration did not
        change during the apply. A Gen2 or Gen3 device takes the system, MQTT, cloud, switch,
        input, light and roller (cover) settings and the Wi-Fi (station, access point, roam threshold) and the login only: name, eco mode, discoverable, timezone, latitude, longitude and
        SNTP server with Sys.SetConfig, MQTT enable, server, port, user, password, client ID,
        topic prefix and the notification flags with MQTT.SetConfig, cloud enable and server
        with Cloud.SetConfig, each input name, type (switch or button) and invert with
        Input.SetConfig (and each input enable and factory_reset), and each relay name, initial
        state, auto on and auto off, with the in_mode of its input, and max power (as
        power_limit), voltage_limit, undervoltage_limit, current_limit, in_locked,
        autorecover_voltage_errors and power_restore_delay, with Switch.SetConfig (a key the
        device does not report is refused with 422 and nothing is written; a limit the device
        refuses is a failed row; the bounds are relayed from the Shelly pages and not confirmed
        on hardware), the roller of a device in cover profile
        (max_open_time, max_close_time, motor_direction, swap_inputs, input_mode, and the
        obstacle and safety settings) with Cover.SetConfig on cover:0, each light (name, initial
        state, auto on and auto off, transition duration, minimum brightness on toggle, button
        fade rate, night mode, warm-up, the power, voltage, undervoltage and current limits and
        the input mode) with Light.SetConfig, the Bluetooth RPC
        (system.device.ble.rpc.enable) with BLE.SetConfig, the Ethernet of a Pro
        model (network.eth enable, ipv4mode, ip, netmask, gw and nameserver) with Eth.SetConfig, and last of all the Wi-Fi station (enable,
        ssid, password, IPv4 mode and static address) with WiFi.SetConfig. A device that reports no
        eth or ble component, or a key it does not list, is refused with 422 and nothing is written.
        An Ethernet change is refused when the manager reaches the device on its Ethernet address
        (read with one Eth.GetStatus call beside the one Shelly.GetConfig) or when the manager
        cannot prove that it does not: it is allowed only where the device has no Ethernet address
        or the address the manager uses is the Wi-Fi station address (WiFi.GetStatus sta_ip). When it is applied together with a change of the Wi-Fi
        network or a station password, when the device runs Ethernet in server mode, and when a static address has no
        address or no gateway, desired or already set (the Shelly page does not require a gateway:
        that rule is the manager's own). The strand behaviour, the restart time and Bluetooth
        pairing (firmware 2.0.0 and later) are not confirmed on hardware. A Gen1 word of the
        same meaning is read as the Gen2 word (last, switch, toggle, edge). They are read back
        from Shelly.GetConfig, except the MQTT and Wi-Fi passwords, which are write-only (the
        MQTT password is sent only with a user). A Wi-Fi ssid is written only with a password,
        or when the device is already on that network, in which case the ssid is left out. A
        wrong static address strands the device. Only the keys the desired
        configuration sets are sent, because the Shelly documentation does not say that
        SetConfig merges. The device decides about a reboot: the apply reboots only when an
        answer says restart_required, a cover write changes invert_directions, or an Ethernet write
        changes a value the device holds. It records that reboot as owed when it reads the answer,
        and a write whose answer is lost is not recorded beforehand, except a cover write that
        changes invert_directions and an Ethernet write that changes a value, which are recorded before the request. If the restart cannot be
        recorded, the apply fails with a warning to reboot by hand. Supported Gen1 settings: name, timezone, location, eco mode,
        discoverable, the relay or roller mode of a Shelly 2.5 (system.device.mode, written first), max power, LED, MQTT (including the update period), SNTP server, cloud (the enabled flag), CoIoT (enabled, update
        period of 15 to 65535 seconds and peer), login (enable, username and password of 1 to 50
        bytes each, written last; the new login is stored once the device accepts it) and
        relays (default_state, auto_on, auto_off and name per channel), for a Dimmer (SHDM-1, SHDM-2)
        lights instead of relays (default_state, auto_on, auto_off, schedule, schedule_rules, btn_type,
        btn_debounce of 60 to 200 ms and swap_inputs per channel, through POST and GET
        /settings/light/<n>; not confirmed on hardware) and its device-level dimming settings
        (min_brightness 0 to 50, fade_rate 1 to 5, transition 0 to 5000 ms, zcross_debounce 50 to 150
        microseconds, and leading_edge as pulse_mode, only where the device reports pulse_mode_detected,
        so never on an SHDM-1; the status LED as led_status_disable; not confirmed on hardware), its
        night mode (enabled, start and end as hh:mm, brightness 1 to 100, through POST
        /settings/night_mode) and warm-up (enabled, brightness 10 to 100 and time 20 to 200 ms, through
        POST /settings/warm_up; with warm-up off only enabled is written), each read back from GET
        /settings; not confirmed on hardware, for an
        RGBW2 (SHRGBW2) lights written to /settings/color/0 in color mode or /settings/white/<n> in
        white mode (name, effect of 0 to 4 in color mode, transition of 0 to 5000 ms, default_state,
        auto_on, auto_off, schedule, schedule_rules, and btn_type and btn_reverse on channel 0 only; the
        device mode is written first; not confirmed on hardware), for a Bulb (SHBLB-1) a light written
        to /settings/light/0 (default_state, auto_on, auto_off, effect of 0 to 6, schedule and
        schedule_rules; the mode, white or color, is written first; not confirmed on hardware), for a
        Duo (SHBDUO-1) or Vintage (SHVIN-1) a light written to /settings/light/0 (name, default_state,
        auto_on, auto_off, schedule and schedule_rules; no mode and no effect) and its night mode
        (enabled, start and end as hh:mm, brightness 0 to 100, through POST /settings/night_mode, read
        back from GET /settings) and transition of 0 to 5000 ms (POST /settings, read back; not
        confirmed on hardware), for a
        model with roller mode
        (SHSW-25) rollers (max_open_time and max_close_time in seconds, motor_direction, swap_inputs and
        input_mode, each read back), and input button types (mode as btn_type and inverted as
        btn_reverse per input; the parameter names, the toggle and edge mapping and the i3 mode set
        are read from the Shelly reference and not confirmed on hardware, and a button type change
        does not report requires_reboot because the reference documents no reboot for it; an input
        entry on a 2.5 whose mode, desired or else reported, is roller is refused with 422 before any
        write, because there the inputs belong to the roller: set the roller keys instead) and
        Wi-Fi (station through POST /settings/sta, access point enable and password through
        POST /settings/ap, only the keys the desired configuration sets; a new ssid without a
        usable password, an access point ssid or key, and a station and an access
        point both enabled return 422, and a failed GET /settings before the write refuses with
        the read's own error and writes nothing; a refused apply leaves config_applied as it
        was; the password
        is write-only and never echoed; Wi-Fi does not report requires_reboot; the route
        behaviour and key names are read from the Shelly reference and not confirmed on
        hardware) and Wi-Fi roaming (roam_enable and roam_threshold, written as
        ap_roaming_enabled and ap_roaming_threshold, a threshold of -100 to -50 dBm, which is the
        manager's own bound and not confirmed on hardware) and the Wi-Fi recovery reboot
        (recovery_reboot, written as wifirecovery_reboot_enabled, on the Shelly 1, 1PM, 2.5 and
        Plug/PlugS only), all three on POST /settings and read back from GET /settings. A value
        out of range, the recovery reboot on a Shelly i3, and a key that the device's GET /settings
        does not report (firmware before v1.10.0) return 422 and write nothing. Applies
        to one device are serialized, from the snapshot to the flag update and the pending-reboot
        record, inside one server process and, on PostgreSQL and MySQL, across manager replicas
        (a lock held in the database, which needs database.max_open_conns of at least 2; with one
        connection only the in-process lock applies; SQLite runs in one process). A second apply
        to the same device, on this server or on another replica, waits up to 15 seconds in all
        (the wait for the in-process lock counts in them) and is then refused with 409.
      operationId: applyDeviceNewConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds success, applied_count, failed_count, requires_reboot, unconfirmed,
            failures (refused settings by path and read-back differences, secret values masked)
            and warnings. unconfirmed is true when a Wi-Fi write changed the station network and
            the device stopped answering (Gen1, Gen2 and Gen3); it is neither a success nor a failure, and the device
            stays pending. requires_reboot is also true when an earlier apply wrote a setting that
            needs a reboot and failed before the device rebooted; it stays owed until a later
            apply reboots the device. On Gen2 and Gen3 a restart the device asked for that
            could not be recorded as owed fails the apply: success is false and warnings tell
            the caller to reboot the device by hand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: The device id in the path is not a number (BAD_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: An admin key is configured and the request has none or a wrong one (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '408':
          description: >-
            The request did not finish within the server's request timeout (REQUEST_TIMEOUT).
            The apply may still have run on the device; read the device state before repeating it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            Nothing written and no flag changed (CONFLICT). The device at the stored address
            reports another MAC than the stored one (the error names both and says to run
            discovery, POST /api/v1/discover), reports no MAC, or the device record has no MAC
            (set it with PUT /api/v1/devices/{id}, field mac). A record with no MAC is refused
            because the device at its address cannot be identified. The same 409 is returned
            when another apply to this device, on this server or on another manager replica, has
            been running for longer than the 15 second wait; nothing was written to the device, the refused call never reaches the
            configuration service's flag updates, and the call can be repeated (the server may
            have read the device's identity before it waited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '422':
          description: >-
            Nothing written (VALIDATION_FAILED). The desired configuration holds an unsupported
            section (Wi-Fi), an input name, type, push action or id that differs from its position,
            a mode the model does not accept (a Shelly i3 takes momentary and follow only), an input
            section on a model with no inputs, a login without a username and password of 1 to 50
            bytes or with credentials while it is off, a cloud server, a CoIoT update period outside
            15 to 65535 seconds, the CoIoT peer "mcast" (an empty peer is the multicast value),
            a relay key other than default_state, auto_on, auto_off and
            name, a relay id that differs from its position in the list, a roller section on a
            model without roller mode, a roller travel time below 1 second, an unknown roller
            motor_direction or input_mode, a roller field other than max_open_time, max_close_time,
            motor_direction, swap_inputs and input_mode,
            an SNTP server that is not an IPv4 address or a host name, a negative MQTT update
            period, a section with no Gen1 mapping such as the debug settings, or a stored field the configuration
            model does not know. On a Gen2 or Gen3 device every section except the system, MQTT,
            cloud, switch, input and roller settings, the Bluetooth RPC (system.device.ble.rpc.enable;
            the top-level enable, dst_addr and listen_port are refused, and so is keep_running, whose
            placement on the Shelly page is unconfirmed), the
            Ethernet (network.eth) and the Wi-Fi (station, access point, roaming), a roller on a device that reports no cover:0 (a switch profile), the
            access point key (wifi.ap.key), switching the access point off while the station is not
            steady, switching an access point on that is off with no password (unless the device
            reports it closed), switching the station off (wifi.enable false), a new
            Wi-Fi network with no password, a login user other than admin, a login switched on
            with no password that can be sent or switched off with a user or password, a login
            realm, a login change in the same apply as a change of the Wi-Fi network, a switch or input value that no Gen2 word names
            (an input type other than switch or button, the Gen1 mode action, a negative timer),
            an input push action or timing, a relay schedule,
            an MQTT setting with no Gen2 key (keep alive, clean session,
            update period, retained-message limits, certificate and SNI flags), an MQTT
            password with no user, an MQTT server that already carries a port beside a separate
            port, an IPv6 MQTT endpoint in one string, and an SNTP server written as host:port,
            are refused the
            same way. The error names the sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '500':
          description: >-
            Server error (INTERNAL_SERVER_ERROR). The body is generic and the cause is in the
            server log. It includes an apply whose database lock was lost while it ran: the
            device may hold a mix of two applies, so the apply sets config_applied false and
            pending_reboot true as a best effort (the two updates are tried twice each and
            then only logged, so a database that stays unreachable leaves the flags as another
            replica set them). Read the device state, or verify it, before relying on the
            flags. Where pending_reboot was recorded, the next apply writes the configuration
            again and reboots once more; where it was not, an apply whose stored settings
            already match the device does not reboot it, so verify the device and reboot it by
            hand if needed. An apply that found the lock already lost, before its first write,
            writes nothing and forces no flag. The call can be repeated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '501':
          description: >-
            The device generation is not supported (NOT_IMPLEMENTED). Gen1 is supported, and
            Gen2 and Gen3 for the system, MQTT, cloud, switch, input and roller (cover) sections, the Wi-Fi station, access point and roam threshold, and the login only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (EXTERNAL_SERVICE_ERROR). Store the right
            login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/new/verify:
    post:
      tags: [Configuration]
      summary: Compare the desired configuration with a Gen1, Gen2 or Gen3 device
      description: >-
        Reads the device and writes nothing. Takes no request body. The MQTT password is
        write-only, so it is not compared, and neither is the Wi-Fi password. On a Gen2 or Gen3
        device the system, MQTT, cloud, switch and input settings and the Wi-Fi station are read
        back, from Shelly.GetConfig. Before it compares anything it reads the MAC the device
        reports and answers 409 when that is not the stored MAC, so another device at the stored
        address is never reported as in sync or as drifted.
      operationId: verifyDeviceNewConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds match and differences; each difference has path, expected and actual,
            with secret values masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: >-
            Device not found, or the device has no desired configuration (NOT_FOUND). With
            nothing to compare the device with, verify does not answer match, and it does not
            contact the device. The drift route answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device at the stored address is not the stored device: its MAC differs, it
            reports none, or the record has none (CONFLICT). Nothing is compared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '422':
          description: >-
            The stored desired configuration holds a field the configuration model does not
            know (VALIDATION_FAILED). Unlike apply, verify does not refuse unsupported
            sections; it compares them with the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '501':
          description: >-
            The device generation is not supported (NOT_IMPLEMENTED). Gen1 is supported, and
            Gen2 and Gen3 for the system, MQTT, cloud, switch, input and roller (cover) sections, the Wi-Fi station, access point and roam threshold, and the login only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (EXTERNAL_SERVICE_ERROR). Store the right
            login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/drift:
    get:
      tags: [Drift]
      summary: Detect configuration drift
      description: >-
        Compares the live device with its desired configuration, the one
        apply writes and verify reads. The stored configuration is not
        consulted and nothing is written.
      operationId: detectConfigDrift
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Drift detection result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigDrift'
        '404':
          description: >-
            The device has no desired configuration, so there is nothing to
            compare it with (this is never reported as "no drift").
        '503':
          description: >-
            The stored device is marked offline (error code DEVICE_OFFLINE). Nothing is sent
            to the device. The offline check comes before the desired-configuration check, so an
            offline device with no desired configuration answers this 503 and not the 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/apply-template:
    post:
      tags: [Templates]
      summary: Apply template to device
      operationId: applyConfigTemplate
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplateRequest'
      responses:
        '200':
          description: Template applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/history:
    get:
      tags: [Configuration]
      summary: Get configuration history
      operationId: getConfigHistory
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Configuration history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/common-settings:
    post:
      tags: [Configuration]
      summary: Settings that the stored imports of several devices have in common
      description: >
        Reads the stored import of each named device in its typed form, with secrets masked, drops every
        secret slot, every per-device value and the raw part, and answers the settings that are equal on all
        compared devices. A device that does not exist or has no stored import is named in `skipped`.
      operationId: getCommonSettings
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_ids]
              properties:
                device_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Compared devices, skipped devices and the common settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: 'No devices, an id that is not positive, more than 200 distinct ids, `options.stop_on_error: true`, or an unknown field'

