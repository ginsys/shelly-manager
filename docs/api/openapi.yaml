            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # Bulk Operations
  /api/v1/config/bulk-import:
    post:
      tags: [Configuration]
      summary: Bulk import configurations
      description: >-
        Reads the live configuration of each named device into the manager, as
        POST /api/v1/devices/{id}/config/import does for one device. It never writes to a device.
        An id that names no device is that device's `failed` entry and the others still run.
        The run stops starting devices 10 seconds before the 30 second request deadline, or when the
        client has left: each device not started is a `skipped` entry whose `error` is `not
        contacted: the time limit of this call was reached or the request ended`. One device that
        outlasts the margin can still end in 408, and its outcome is then unknown.
      operationId: bulkImportConfigs
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Bulk import result; `data` is a BulkConfigResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-drift-detect:
    post:
      tags: [Drift]
      summary: Bulk drift detection
      description: >-
        Compares the stored and the live configuration of each named device. It never writes to a device.
        The run stops starting devices 10 seconds before the 30 second request deadline, or when the
        client has left: each device not started is a `skipped` result whose `error` is `not
        contacted: the time limit of this call was reached or the request ended`. One device that
        outlasts the margin can still end in 408, and its outcome is then unknown.
      operationId: bulkDetectDrift
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Bulk drift detection result; `data` is a BulkDriftResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-drift-detect-enhanced:
    post:
      tags: [Drift]
      summary: Bulk drift detection with comprehensive reporting
      description: >-
        The same selection and `stop_on_error` as bulk-drift-detect; the answer is the
        comprehensive drift report, which covers the devices that ran. With `stop_on_error` the
        devices after the first error are not contacted and are not in the report, so its totals
        add up. If the report cannot be generated or stored, the call still answers 200 with the
        BulkDriftResult of bulk-drift-detect (`data.total`, `data.results`) in its place. It answers
        that BulkDriftResult too when the run stopped starting devices at its time limit (10 seconds
        before the 30 second request deadline, or the client left): the devices not started are
        `skipped` with the reason, and no report is stored for the devices that did run.
      operationId: bulkDetectDriftEnhanced
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeviceRequest'
      responses:
        '200':
          description: Enhanced bulk drift detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, or a field or option the server does not read (VALIDATION_FAILED); no device is contacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-download:
    post:
      tags: [Configuration]
      summary: Download the desired configuration of several devices
      description: >-
        Answers one JSON file (`Content-Disposition: attachment`) with an entry per named device,
        in request order, holding the desired configuration with every secret masked. It reads the
        database and never contacts a device. A device that cannot be read is an entry with
        `status: error` and a fixed text, and the call still answers 200. At most 200 devices per
        call. The request is the one of the other bulk routes, except that `options.stop_on_error`
        can only be `false`.
      operationId: bulkDownloadConfigs
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDownloadRequest'
      responses:
        '200':
          description: The file; the body is a BulkDownloadFile
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="shelly-configs-<UTC date and time>.json"`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDownloadFile'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, more than 200 devices, `options.stop_on_error`, or a field the server does not read (VALIDATION_FAILED); nothing is read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: An admin key is configured and the request has none or a wrong one (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/config/bulk-apply:
    post:
      tags: [Configuration]
      summary: Apply one partial configuration to several devices
      description: >-
        Stores `config` as the overrides of each named device (PATCH rules, never a template) and
        applies it through the per-device apply, the only call that reaches a device, so no device
        that is not named is written. Before the first write `config` is checked against the model of
        every selected device; if any cannot take it, nothing is stored or written to any. The call
        is not atomic: it answers 200 with one entry per device, each with one of six statuses, and
        rolls nothing back. The overrides stay stored when the apply does not succeed. At most 10
        devices per call. The call has a request deadline of 5 minutes, not the 30 seconds of the
        other routes, and a run budget of 4 minutes: once the budget is spent or the client has
        left, no later device is started and each is `skipped` with a reason that says so.
      operationId: bulkApplyConfigs
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApplyRequest'
      responses:
        '200':
          description: Per-device results, in the `data` member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BulkApplyResult'
        '400':
          description: No body, invalid JSON, no `device_ids`, a non-positive id, more than 10 devices, a missing or empty `config`, a field the server does not read in the request or in `config` (VALIDATION_FAILED); nothing is read or written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: An admin key is configured and the request has none or a wrong one (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '408':
          description: >-
            The request passed its deadline (REQUEST_TIMEOUT), for example when a device ignores its
            context past the run budget or a step before the first write stalls. The outcome is
            unknown: devices may have been written, so this does not tell you that nothing was
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

