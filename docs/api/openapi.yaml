      summary: Get device metrics
      operationId: getDeviceMetrics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Device metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /metrics/drift:
    get:
      tags: [Metrics]
      summary: Get drift summary
      operationId: getDriftMetrics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Drift metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /metrics/security:
    get:
      tags: [Metrics]
      summary: Get security metrics
      operationId: getSecurityMetrics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Security metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # Provisioning Endpoints
  /api/v1/discover:
    post:
      tags: [Provisioning]
      summary: Discover devices on network
      operationId: discoverDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/provisioning/status:
    get:
      tags: [Provisioning]
      summary: Get provisioning status
      operationId: getProvisioningStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: >-
            Provisioning status. The body is this object itself, not the
            `APIResponse` envelope, and it is a fixed placeholder today.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: idle
                  devices:
                    type: array
                    items:
                      type: string
                  last_run:
                    type: [string, 'null']
                    format: date-time
                  next_run:
                    type: [string, 'null']
                    format: date-time
                  auto_provision:
                    type: boolean

  /api/v1/provisioning/provision:
    post:
      tags: [Provisioning]
      summary: Provision discovered devices
      operationId: provisionDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                devices:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: >-
            Provisioning result. The body is this object itself, not the
            `APIResponse` envelope, and it is a fixed placeholder today: the
            handler reads no request body and starts nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: provisioning_started
                  message:
                    type: string

  /api/v1/provisioner/agents:
    get:
      tags: [Provisioning]
      summary: List provisioner agents
      operationId: listProvisionerAgents
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProvisionerAgent'

  /api/v1/provisioner/agents/register:
    post:
      tags: [Provisioning]
      summary: Register provisioner agent
      operationId: registerProvisionerAgent
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionerAgent'
      responses:
        '201':
          description: >-
            Agent registered. `data.agent_token` is the agent's own token, sent as `X-Agent-Token` on poll, task
            status and report. A new registration of the same id replaces it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The id is online (seen within 5 minutes) and the request carries neither that agent's token nor the
            admin key.

  /api/v1/provisioner/agents/{id}/tasks:
    get:
      tags: [Provisioning]
      summary: Poll tasks for agent
      operationId: pollAgentTasks
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AgentToken'
      responses:
        '401':
          description: No known agent token, so the agent registers again
        '403':
          description: The token belongs to another agent than the path id
        '200':
          description: Agent tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProvisioningTask'

  /api/v1/provisioner/tasks:
    get:
      tags: [Provisioning]
      summary: List provisioning tasks
      operationId: listProvisioningTasks
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Provisioning tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProvisioningTask'
                          count:
                            type: integer

    post:
      tags: [Provisioning]
      summary: Create provisioning task
      operationId: createProvisioningTask
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningTask'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_id:
                            type: string
                          status:
                            type: string
                          created_at:
                            type: string
                            format: date-time

  /api/v1/provisioner/tasks/{id}/status:
    put:
      tags: [Provisioning]
      summary: Update task status
      operationId: updateTaskStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, running, completed, failed]
                result:
                  type: object
      responses:
        '401':
          description: No known agent token, so the agent registers again
        '403':
          description: The task is not assigned to the token's agent (an unassigned or unknown task is nobody's)
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/provisioner/discovered-devices:
    get:
      tags: [Provisioning]
      summary: Get discovered devices
      operationId: getDiscoveredDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Discovered devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

    post:
      tags: [Provisioning]
      summary: Report discovered devices
      operationId: reportDiscoveredDevices
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  description: Must be the token's agent. A named `task_id` is completed only if assigned to it.
                devices:
                  type: array
                  items:
                    $ref: '#/components/schemas/Device'
      responses:
        '401':
          description: No known agent token, so the agent registers again
        '403':
          description: The body `agent_id` is not the token's agent
        '200':
          description: Devices reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/provisioner/health:
    get:
      tags: [Provisioning]
      summary: Provisioner health check
      operationId: getProvisionerHealth
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # DHCP Endpoint
  /api/v1/dhcp/reservations:
    get:
      tags: [Admin]
      summary: Get DHCP reservations
      operationId: getDhcpReservations
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: >-
            DHCP reservations. The body is a bare JSON array, not the
            `APIResponse` envelope, and it is always empty today.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # Admin Endpoints
  /api/v1/admin/rotate-admin-key:
    post:
      tags: [Admin]
      summary: Rotate admin API key
      operationId: rotateAdminKey
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_key:
                  type: string
                  description: The new admin key. It must not be blank and must not start or end with whitespace, because header handling drops it (always at the end, and at the start in `X-API-Key`), so the key could not be presented reliably.
              required:
                - new_key
      responses:
        '200':
          description: Key rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid JSON, a blank key, or a key that starts or ends with whitespace (VALIDATION_FAILED); the stored key does not change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
