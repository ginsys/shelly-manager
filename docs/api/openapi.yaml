  /api/v1/devices/{id}/config/new/apply:
    post:
      tags: [Configuration]
      summary: Write the desired configuration to a Gen1, Gen2 or Gen3 device, read it back and compare
      description: >-
        Needs the admin key when the server has one configured; with no admin key configured
        the route is open. Takes no request body. Before it marks or writes anything it reads
        the MAC the device at the stored address reports and compares it with the stored MAC
        (case and the separators colon, dash and dot are ignored); a different MAC, a device
        that reports none, or a record with no MAC is refused with 409 and nothing is written,
        so an address that now leads to another device never receives this device's
        configuration. Clears config_applied before the write
        and sets it again only if the read-back matches and the desired configuration did not
        change during the apply. A Gen2 or Gen3 device takes the system, MQTT, cloud, switch
        and input settings and the Wi-Fi (station, access point, roam threshold) and the login only: name, eco mode, discoverable, timezone, latitude, longitude and
        SNTP server with Sys.SetConfig, MQTT enable, server, port, user, password, client ID,
        topic prefix and the notification flags with MQTT.SetConfig, cloud enable and server
        with Cloud.SetConfig, each input name, type (switch or button) and invert with
        Input.SetConfig, and each relay name, initial state, auto on and auto off, with the
        in_mode of its input, with Switch.SetConfig, and last of all the Wi-Fi station (enable,
        ssid, password, IPv4 mode and static address) with WiFi.SetConfig. A Gen1 word of the
        same meaning is read as the Gen2 word (last, switch, toggle, edge). They are read back
        from Shelly.GetConfig, except the MQTT and Wi-Fi passwords, which are write-only (the
        MQTT password is sent only with a user). A Wi-Fi ssid is written only with a password,
        or when the device is already on that network, in which case the ssid is left out. A
        wrong static address strands the device. Only the keys the desired
        configuration sets are sent, because the Shelly documentation does not say that
        SetConfig merges. The device decides about a reboot: the apply reboots only when an
        answer says restart_required. It records that reboot as owed when it reads the answer,
        and a write whose answer is lost is not recorded beforehand. If the restart cannot be
        recorded, the apply fails with a warning to reboot by hand. Supported Gen1 settings: name, timezone, location, eco mode,
        discoverable, max power, LED, MQTT (including the update period), SNTP server, cloud (the enabled flag), CoIoT (enabled, update
        period of 15 to 65535 seconds and peer), login (enable, username and password of 1 to 50
        bytes each, written last; the new login is stored once the device accepts it) and
        relays (default_state, auto_on, auto_off and name per channel), for a model with roller mode
        (SHSW-25) rollers (max_open_time and max_close_time in seconds, motor_direction, swap_inputs and
        input_mode, each read back), and input button types (mode as btn_type and inverted as
        btn_reverse per input; the parameter names, the toggle and edge mapping and the i3 mode set
        are read from the Shelly reference and not confirmed on hardware, and a button type change
        does not report requires_reboot because the reference documents no reboot for it) and
        Wi-Fi (station through POST /settings/sta, access point enable and password through
        POST /settings/ap, only the keys the desired configuration sets; a new ssid without a
        usable password, an access point ssid or key, roam_threshold and a station and an access
        point both enabled return 422, and a failed GET /settings before the write refuses with
        the read's own error and writes nothing; a refused apply leaves config_applied as it
        was; the password
        is write-only and never echoed; Wi-Fi does not report requires_reboot; the route
        behaviour and key names are read from the Shelly reference and not confirmed on
        hardware). Applies
        to one device are serialized, from the snapshot to the flag update and the pending-reboot
        record, inside one server process and, on PostgreSQL and MySQL, across manager replicas
        (a lock held in the database, which needs database.max_open_conns of at least 2; with one
        connection only the in-process lock applies; SQLite runs in one process). A second apply
        to the same device, on this server or on another replica, waits up to 15 seconds in all
        (the wait for the in-process lock counts in them) and is then refused with 409.
      operationId: applyDeviceNewConfig
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds success, applied_count, failed_count, requires_reboot, unconfirmed,
            failures (refused settings by path and read-back differences, secret values masked)
            and warnings. unconfirmed is true when a Wi-Fi write changed the station network and
            the device stopped answering (Gen1, Gen2 and Gen3); it is neither a success nor a failure, and the device
            stays pending. requires_reboot is also true when an earlier apply wrote a setting that
            needs a reboot and failed before the device rebooted; it stays owed until a later
            apply reboots the device. On Gen2 and Gen3 a restart the device asked for that
            could not be recorded as owed fails the apply: success is false and warnings tell
            the caller to reboot the device by hand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: The device id in the path is not a number (BAD_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: An admin key is configured and the request has none or a wrong one (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '408':
          description: >-
            The request did not finish within the server's request timeout (REQUEST_TIMEOUT).
            The apply may still have run on the device; read the device state before repeating it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            Nothing written and no flag changed (CONFLICT). The device at the stored address
            reports another MAC than the stored one (the error names both and says to run
            discovery, POST /api/v1/discover), reports no MAC, or the device record has no MAC
            (set it with PUT /api/v1/devices/{id}, field mac). A record with no MAC is refused
            because the device at its address cannot be identified. The same 409 is returned
            when another apply to this device, on this server or on another manager replica, has
            been running for longer than the 15 second wait; nothing was written to the device, the refused call never reaches the
            configuration service's flag updates, and the call can be repeated (the server may
            have read the device's identity before it waited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '422':
          description: >-
            Nothing written (VALIDATION_FAILED). The desired configuration holds an unsupported
            section (Wi-Fi), an input name, type, push action or id that differs from its position,
            a mode the model does not accept (a Shelly i3 takes momentary and follow only), an input
            section on a model with no inputs, a login without a username and password of 1 to 50
            bytes or with credentials while it is off, a cloud server, a CoIoT update period outside
            15 to 65535 seconds, the CoIoT peer "mcast" (an empty peer is the multicast value),
            a relay key other than default_state, auto_on, auto_off and
            name, a relay id that differs from its position in the list, a roller section on a
            model without roller mode, a roller travel time below 1 second, an unknown roller
            motor_direction or input_mode, a roller field other than max_open_time, max_close_time,
            motor_direction, swap_inputs and input_mode,
            an SNTP server that is not an IPv4 address or a host name, a negative MQTT update
            period, a section with no Gen1 mapping such as the debug settings, or a stored field the configuration
            model does not know. On a Gen2 or Gen3 device every section except the system, MQTT,
            cloud, switch and input settings and the Wi-Fi (station, access point, roaming), the
            access point key (wifi.ap.key), switching the access point off while the station is not
            steady, switching an access point on that is off with no password (unless the device
            reports it closed), switching the station off (wifi.enable false), a new
            Wi-Fi network with no password, a login user other than admin, a login switched on
            with no password that can be sent or switched off with a user or password, a login
            realm, a login change in the same apply as a change of the Wi-Fi network, a switch or input value that no Gen2 word names
            (an input type other than switch or button, the Gen1 mode action, a negative timer),
            an input push action or timing, a relay schedule,
            an MQTT setting with no Gen2 key (keep alive, clean session,
            update period, retained-message limits, certificate and SNI flags), an MQTT
            password with no user, an MQTT server that already carries a port beside a separate
            port, an IPv6 MQTT endpoint in one string, and an SNTP server written as host:port,
            are refused the
            same way. The error names the sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '500':
          description: >-
            Server error (INTERNAL_SERVER_ERROR). The body is generic and the cause is in the
            server log. It includes an apply whose database lock was lost while it ran: the
            device may hold a mix of two applies, so the apply sets config_applied false and
            pending_reboot true as a best effort (the two updates are tried twice each and
            then only logged, so a database that stays unreachable leaves the flags as another
            replica set them). Read the device state, or verify it, before relying on the
            flags. Where pending_reboot was recorded, the next apply writes the configuration
            again and reboots once more; where it was not, an apply whose stored settings
            already match the device does not reboot it, so verify the device and reboot it by
            hand if needed. An apply that found the lock already lost, before its first write,
            writes nothing and forces no flag. The call can be repeated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '501':
          description: >-
            The device generation is not supported (NOT_IMPLEMENTED). Gen1 is supported, and
            Gen2 and Gen3 for the system, MQTT, cloud, switch and input sections, the Wi-Fi station, access point and roam threshold, and the login only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (EXTERNAL_SERVICE_ERROR). Store the right
            login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/devices/{id}/config/new/verify:
    post:
      tags: [Configuration]
      summary: Compare the desired configuration with a Gen1, Gen2 or Gen3 device
      description: >-
        Reads the device and writes nothing. Takes no request body. The MQTT password is
        write-only, so it is not compared, and neither is the Wi-Fi password. On a Gen2 or Gen3
        device the system, MQTT, cloud, switch and input settings and the Wi-Fi station are read
        back, from Shelly.GetConfig. Before it compares anything it reads the MAC the device
        reports and answers 409 when that is not the stored MAC, so another device at the stored
        address is never reported as in sync or as drifted.
      operationId: verifyDeviceNewConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            data holds match and differences; each difference has path, expected and actual,
            with secret values masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '404':
          description: >-
            Device not found, or the device has no desired configuration (NOT_FOUND). With
            nothing to compare the device with, verify does not answer match, and it does not
            contact the device. The drift route answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '409':
          description: >-
            The device at the stored address is not the stored device: its MAC differs, it
            reports none, or the record has none (CONFLICT). Nothing is compared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '422':
          description: >-
            The stored desired configuration holds a field the configuration model does not
            know (VALIDATION_FAILED). Unlike apply, verify does not refuse unsupported
            sections; it compares them with the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '501':
          description: >-
            The device generation is not supported (NOT_IMPLEMENTED). Gen1 is supported, and
            Gen2 and Gen3 for the system, MQTT, cloud, switch and input sections, the Wi-Fi station, access point and roam threshold, and the login only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '502':
          description: >-
            The device rejected the stored login (EXTERNAL_SERVICE_ERROR). Store the right
            login with PUT /api/v1/devices/{id}/config/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

